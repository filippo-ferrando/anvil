name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The QEMU tests run under TCG, so no /dev/kvm is needed. Docker tests still
      # skip themselves when the runner has no dockerd.
      - name: Install QEMU and test tools
        run: |
          sudo=""
          [ "$(id -u)" = "0" ] || sudo=sudo
          $sudo apt-get update
          pkgs="qemu-system-x86 qemu-utils xorriso zstd openssh-client"
          # Debian bookworm has no virtiofsd package; the virtiofs tests skip without it.
          apt-cache show virtiofsd >/dev/null 2>&1 && pkgs="$pkgs virtiofsd"
          $sudo apt-get install -y $pkgs
          if docker info >/dev/null 2>&1; then
            docker pull busybox:latest
            docker pull alpine:3.22
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        run: go test -race ./...
