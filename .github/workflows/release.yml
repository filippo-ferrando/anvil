name: Release packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-gui-tools:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22
    steps:
      - name: Install job tools
        # tar and zstd: actions/cache needs GNU tar, Alpine's busybox one lacks its options.
        run: apk add --no-cache bash nodejs git file coreutils tar zstd

      - uses: actions/checkout@v7

      # scripts/tools.versions pins every version, so the two hashes name the binaries built.
      - id: gui-cache
        uses: actions/cache@v4
        with:
          path: build/gui-tools
          key: gui-tools-${{ runner.arch }}-${{ hashFiles('scripts/build-gui-tools.sh', 'scripts/tools.versions') }}

      - name: Build static waypipe + xwayland-satellite
        if: steps.gui-cache.outputs.cache-hit != 'true'
        run: scripts/build-gui-tools.sh build/gui-tools

      - uses: actions/upload-artifact@v3
        with:
          name: gui-tools
          path: build/gui-tools/
          retention-days: 1

  build-arch:
    needs: [version, build-gui-tools]
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel go git nodejs

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v3
        with:
          name: gui-tools
          path: /tmp/pkgroot/gui-tools

      - name: Fetch static firecracker + jailer
        run: scripts/fetch-firecracker.sh /tmp/pkgroot/firecracker

      - name: Create a non-root build user

        run: |
          useradd -m builder
          chmod +x /tmp/pkgroot/gui-tools/*
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkgroot

      - name: Build anvil + anvild packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          cat > /tmp/build-arch.sh <<SCRIPT
          set -euo pipefail
          # package_anvild() reads \$startdir/../common/..., so the
          # rendered PKGBUILD needs that same sibling layout reproduced
          # here, not just PKGBUILD + anvild.install on their own.
          mkdir -p /tmp/pkgroot/archlinux /tmp/pkgroot/common
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" \
              -e "s#^source=.*#source=(\"anvil::git+file://$GITHUB_WORKSPACE\")#" \
              "$GITHUB_WORKSPACE/packaging/archlinux/PKGBUILD" > /tmp/pkgroot/archlinux/PKGBUILD
          cp "$GITHUB_WORKSPACE/packaging/archlinux/anvild.install" /tmp/pkgroot/archlinux/
          cp "$GITHUB_WORKSPACE"/packaging/common/* /tmp/pkgroot/common/
          cd /tmp/pkgroot/archlinux
          makepkg --noconfirm
          SCRIPT
          chmod +x /tmp/build-arch.sh
          chown builder:builder /tmp/build-arch.sh
          su builder -c /tmp/build-arch.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp /tmp/pkgroot/archlinux/*.pkg.tar.zst out/
          # Guard: debug packages are never part of a release.
          rm -f out/*-debug-* out/*-debuginfo-* out/*-debugsource-*

      - uses: actions/upload-artifact@v3
        with:
          name: arch-packages
          path: out/*.pkg.tar.zst
          retention-days: 1

  build-deb:
    needs: [version, build-gui-tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v3
        with:
          name: gui-tools
          path: build/gui-tools

      - run: chmod +x build/gui-tools/*

      - name: Fetch static firecracker + jailer
        run: scripts/fetch-firecracker.sh build/firecracker

      - name: Build anvil + anvild .deb packages
        env:
          VERSION: ${{ needs.version.outputs.version }}

        run: packaging/deb/build.sh "$VERSION"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp packaging/deb/*.deb out/

      - uses: actions/upload-artifact@v3
        with:
          name: deb-packages
          path: out/*.deb
          retention-days: 1

  build-rpm:
    needs: [version, build-gui-tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v3
        with:
          name: gui-tools
          path: build/gui-tools

      - run: chmod +x build/gui-tools/*

      - name: Fetch static firecracker + jailer
        run: scripts/fetch-firecracker.sh build/firecracker

      - name: Install rpmbuild

        run: |
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y rpm
          else
            sudo apt-get update
            sudo apt-get install -y rpm
          fi

      - name: Build anvil + anvild .rpm packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/rpm/build.sh "$VERSION"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp packaging/rpm/*.rpm out/
          # Guard: debug packages are never part of a release.
          rm -f out/*-debug-* out/*-debuginfo-* out/*-debugsource-*

      - uses: actions/upload-artifact@v3
        with:
          name: rpm-packages
          path: out/*.rpm
          retention-days: 1

  release:
    needs: [build-arch, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/**/*
          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changelog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # The automatic Actions token can't push to the protected main branch.
          token: ${{ secrets.LOCAL_TOKEN || github.token }}

      # Rebuilt from every tag each time, so a failed run is fixed by the next one.
      - name: Update CHANGELOG.md on main
        run: |
          git fetch --tags --force
          scripts/changelog.sh > CHANGELOG.md
          git diff --quiet -- CHANGELOG.md && exit 0
          git config user.name "anvil-release"
          git config user.email "ferrandodfilippo+anvil@ik.me"
          git add CHANGELOG.md
          git commit -m "chore(release): changelog for $GITHUB_REF_NAME [skip ci]"
          git push origin HEAD:main
