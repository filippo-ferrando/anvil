name: Release packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-arch:
    needs: version
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel go git nodejs

      - uses: actions/checkout@v7

      - name: Create a non-root build user

        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build anvil + anvild packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          cat > /tmp/build-arch.sh <<SCRIPT
          set -euo pipefail
          # package_anvild() reads \$startdir/../common/..., so the
          # rendered PKGBUILD needs that same sibling layout reproduced
          # here, not just PKGBUILD + anvild.install on their own.
          mkdir -p /tmp/pkgroot/archlinux /tmp/pkgroot/common
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" \
              -e "s#^source=.*#source=(\"anvil::git+file://$GITHUB_WORKSPACE\")#" \
              "$GITHUB_WORKSPACE/packaging/archlinux/PKGBUILD" > /tmp/pkgroot/archlinux/PKGBUILD
          cp "$GITHUB_WORKSPACE/packaging/archlinux/anvild.install" /tmp/pkgroot/archlinux/
          cp "$GITHUB_WORKSPACE"/packaging/common/* /tmp/pkgroot/common/
          cd /tmp/pkgroot/archlinux
          makepkg --noconfirm
          SCRIPT
          chmod +x /tmp/build-arch.sh
          chown builder:builder /tmp/build-arch.sh
          su builder -c /tmp/build-arch.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp /tmp/pkgroot/archlinux/*.pkg.tar.zst out/

      - uses: actions/upload-artifact@v3
        with:
          name: arch-packages
          path: out/*.pkg.tar.zst
          retention-days: 1

  build-deb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build anvil + anvild .deb packages
        env:
          VERSION: ${{ needs.version.outputs.version }}

        run: packaging/deb/build.sh "$VERSION"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp packaging/deb/*.deb out/

      - uses: actions/upload-artifact@v3
        with:
          name: deb-packages
          path: out/*.deb
          retention-days: 1

  build-rpm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install rpmbuild

        run: |
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y rpm
          else
            sudo apt-get update
            sudo apt-get install -y rpm
          fi

      - name: Build anvil + anvild .rpm packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/rpm/build.sh "$VERSION"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp packaging/rpm/*.rpm out/

      - uses: actions/upload-artifact@v3
        with:
          name: rpm-packages
          path: out/*.rpm
          retention-days: 1

  release:
    needs: [build-arch, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
