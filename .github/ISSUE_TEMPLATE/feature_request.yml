name: Feature request
description: A new command, option or behaviour.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check [PLAN.md](https://github.com/filippo-ferrando/anvil/blob/main/PLAN.md) first, the feature may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible to do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command or behaviour that would solve it.
