syntax = "proto3";

package anvil.v1;

option go_package = "github.com/anvil-project/anvil/api/gen/anvil/v1;anvilv1";

// InstanceService manages the lifecycle of VM and container instances.
service InstanceService {
  rpc Launch(LaunchRequest) returns (stream LaunchProgress);

  // Fork creates a new instance whose disk starts as a copy of an existing
  // instance's disk, preserving the same backing file. Safe to call while the source is running; VM instances only.
  rpc Fork(ForkRequest) returns (stream LaunchProgress);

  rpc List(ListRequest) returns (ListReply);
  rpc Info(InfoRequest) returns (InfoReply);
  rpc Start(StartRequest) returns (StartReply);
  rpc Stop(StopRequest) returns (StopReply);
  rpc Delete(DeleteRequest) returns (DeleteReply);
  rpc Purge(PurgeRequest) returns (PurgeReply);
  rpc Logs(LogsRequest) returns (stream LogChunk);
  rpc Mount(MountRequest) returns (MountReply);
  rpc Umount(UmountRequest) returns (UmountReply);

  // AddPort/RemovePort change a running instance's port forwards without recreating it: a VM applies this live over QMP.
  // A container recreates its underlying container instead (Docker has no live port-binding mutation), restarting it if it was running.
  rpc AddPort(AddPortRequest) returns (AddPortReply);
  rpc RemovePort(RemovePortRequest) returns (RemovePortReply);

  // Stats returns a live resource-usage snapshot for a running instance.
  rpc Stats(StatsRequest) returns (StatsReply);

  // Watch streams instance changes (create, state/config change, delete) as they happen.
  // Events are change hints: a client that falls far behind may miss some.
  rpc Watch(WatchRequest) returns (stream WatchEvent);

  // WaitReady streams progress until a running instance's first-boot setup (cloud-init
  // for a VM) finished. Ends with an Instance event, or an Error one on failure or timeout.
  rpc WaitReady(WaitReadyRequest) returns (stream LaunchProgress);

  // Update changes an existing instance's settings; unset fields stay as they are.
  // CPU and memory of a running VM change live when possible, else at its next start (see restart_pending).
  rpc Update(UpdateRequest) returns (UpdateReply);
}

message UpdateRequest {
  string name = 1;
  optional int32 cpus = 2;        // VM only
  optional int64 memory_mib = 3;  // VM only
  optional int64 disk_gib = 4;    // VM only, grow only; live on a running VM
  optional bool autostart = 5;
  RestartPolicy restart_policy = 6; // unset = unchanged
}

message UpdateReply {
  Instance instance = 1;
  bool restart_pending = 2; // some changes wait for the next start of the running VM
  repeated string notes = 3; // what was applied and how, for display
}

message WaitReadyRequest {
  string name = 1;
  int32 timeout_seconds = 2; // defaults to 900
}

message WatchRequest {
  bool include_existing = 1; // first send one UPDATED event per existing instance
}

enum WatchEventType {
  WATCH_EVENT_TYPE_UNSPECIFIED = 0;
  WATCH_EVENT_TYPE_UPDATED = 1;
  WATCH_EVENT_TYPE_DELETED = 2;
}

message WatchEvent {
  WatchEventType type = 1;
  Instance instance = 2; // for DELETED only id, name and kind are set
}

message AddPortRequest {
  string name = 1;
  PortMapping port = 2;
}

message AddPortReply {}

message RemovePortRequest {
  string name = 1;
  int32 host_port = 2;
  string protocol = 3; // "tcp" | "udp", empty defaults to "tcp"
}

message RemovePortReply {}

message StatsRequest {
  string name = 1;
}

// InstanceStats is a point-in-time resource-usage reading for one running instance.
message InstanceStats {
  double cpu_percent = 1; // normalized to the instance's own CPU allocation (100% = fully using every assigned CPU)

  int64 mem_used_bytes = 2;
  int64 mem_limit_bytes = 3;

  // Disk space: VM only (the provisioned qcow2). disk_total_bytes of 0
  // means space usage isn't available for this instance.
  int64 disk_used_bytes = 4;
  int64 disk_total_bytes = 5;

  // Disk I/O rate: container only, averaged over a short live sample.
  double disk_read_bytes_per_sec = 6;
  double disk_write_bytes_per_sec = 7;

  // Network throughput, averaged over a short live sample. Not available
  // for a VM using SLIRP networking (no host-visible interface to sample).
  bool net_available = 8;
  double net_rx_bytes_per_sec = 9;
  double net_tx_bytes_per_sec = 10;

  int64 uptime_seconds = 11;
  string address = 12; // best-known reachable address; empty if unknown
}

message StatsReply {
  InstanceStats stats = 1;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_VM = 1;
  KIND_CONTAINER = 2;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_STOPPED = 1;
  STATE_STARTING = 2;
  STATE_RUNNING = 3;
  STATE_STOPPING = 4;
  STATE_DELETING = 5;
  STATE_DELETED = 6;
  STATE_ERROR = 7;
}

message VMSpec {
  string image_ref = 1;
  string arch = 2;
  int32 cpus = 3;
  int64 memory_mib = 4;
  int64 disk_gib = 5;
  string cloud_init_user_data = 6;
  string cloud_init_name = 7; // reference into the saved cloud-init library
  string network_mode = 8;    // "slirp" | "bridge"
  repeated string ssh_public_keys = 9;

  // Daemon-populated: the allocated SSH host-forward port and the image's default user.
  int32 ssh_port = 10;
  string default_user = 11;

  // Host directories shared into the guest via virtiofs, managed by InstanceService.Mount/Umount.
  repeated Mount mounts = 12;

  // Daemon-populated when this VM joins an intent's bridge network.
  string bridge_interface = 13; // Linux interface name of the intent's shared bridge
  string static_ip = 14;        // CIDR, e.g. "10.55.201.4/24"
  string gateway = 15;

  // Ports to publish from the host into the guest; only meaningful in SLIRP mode.
  repeated PortMapping ports = 16;

  // Daemon-populated: every other intent member's role -> static IP at launch time.
  map<string, string> extra_hosts = 17;

  // Set only when relaunching a migrated instance: adopts this disk directly, skipping cloud-init.
  string source_disk_path = 18;

  // Set with source_disk_path when that disk is only a delta on top of the base image with
  // this SHA256; the daemon rebases it onto its own identical copy of that base.
  string source_disk_base_sha256 = 19;

  // Skips installing qemu-guest-agent through cloud-init. Without it, IP reporting,
  // agent shutdown and precise cloud-init status aren't available.
  bool no_guest_agent = 20;

  SnapshotSchedule snapshot_schedule = 21;

  // Set with source_disk_base_sha256 when the base image itself travelled with the
  // disk, because the target didn't have it cached. Adopted before the rebase.
  string source_base_image_path = 22;
}

// Mount is one host directory shared into a VM's guest over virtiofs.
message Mount {
  string host_path = 1;
  string guest_path = 2;
  string tag = 3; // internal virtiofs tag, assigned automatically
  bool read_only = 4;

  // Set only when relaunching a migrated VM: the shared folder's contents were
  // uploaded here, and are moved into place before the mount is recreated.
  string source_data_path = 5;
}

enum ContainerEngine {
  CONTAINER_ENGINE_UNSPECIFIED = 0;
  CONTAINER_ENGINE_DOCKER = 1;
  CONTAINER_ENGINE_PODMAN = 2;
}

message ContainerSpec {
  string image_ref = 1;
  map<string, string> env = 2;
  repeated string entrypoint = 3;
  repeated string cmd = 4;
  repeated VolumeMount volumes = 5;
  repeated PortMapping ports = 6;
  string network_mode = 7;
  ContainerEngine engine = 8;

  // Daemon-populated: the engine's own container ID, set at create time.
  string container_id = 9;

  // Daemon-populated when this container joins an intent's network.
  string network_alias = 10;
  map<string, string> extra_hosts = 11;
}

message VolumeMount {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;

  // Same as Mount.source_data_path, for a migrated container's bind mount.
  string source_data_path = 4;
}

message PortMapping {
  int32 host_port = 1;
  int32 guest_port = 2;
  string protocol = 3; // "tcp" | "udp"
}

message Instance {
  string id = 1;
  string name = 2;
  Kind kind = 3;
  State state = 4;
  int64 created_at_unix = 5;
  map<string, string> labels = 6;
  VMSpec vm = 7;
  ContainerSpec container = 8;

  // Daemon-populated, live: what the guest agent last reported. Unset when unknown.
  GuestInfo guest = 9;

  // autostart starts the instance when anvild starts, unless it was last stopped on purpose.
  bool autostart = 10;
  RestartPolicy restart_policy = 11;
}

// RestartPolicy says what anvild does when an instance stops without being asked to.
message RestartPolicy {
  string mode = 1;        // "no" (default), "on-failure" (exited with an error), "always"
  int32 max_retries = 2;  // on-failure only: give up after this many restarts in a row; 0 = no limit
}

// SnapshotSchedule takes a live snapshot of a running VM every interval, keeping the newest ones.
message SnapshotSchedule {
  int64 every_seconds = 1;  // 0 = no schedule
  int32 keep = 2;           // scheduled snapshots to keep; older ones are deleted
  int64 last_run_unix = 3;  // daemon-populated
}

enum CloudInitStatus {
  CLOUD_INIT_STATUS_UNSPECIFIED = 0; // unknown, e.g. no guest agent yet
  CLOUD_INIT_STATUS_RUNNING = 1;
  CLOUD_INIT_STATUS_DONE = 2;
  CLOUD_INIT_STATUS_ERROR = 3;
  CLOUD_INIT_STATUS_DISABLED = 4; // nothing to do this boot, e.g. a migrated disk
}

// GuestInfo is what a VM's qemu-guest-agent reports about the running guest.
message GuestInfo {
  bool agent_connected = 1;
  repeated string ip_addresses = 2; // CIDR form, loopback and link-local left out
  CloudInitStatus cloud_init = 3;
}

message LaunchRequest {
  string name = 1;
  Kind kind = 2;
  VMSpec vm = 3;
  ContainerSpec container = 4;

  // When set, this launch joins (or creates) that intent as a member instead
  // of producing a standalone instance.
  string intent_name = 5;
  string role = 6;

  bool no_start = 7;

  // Internal only: used by `anvil migrate-import` to pin a relaunched
  // intent member to its exact original network.
  string pinned_subnet = 8;
  string pinned_gateway = 9;
  string pinned_docker_ip_range = 10;
  string pinned_static_ip = 11;

  // wait keeps the stream open after the instance started, until its first-boot setup
  // (cloud-init for a VM) finished. wait_timeout_seconds defaults to 900.
  bool wait = 12;
  int32 wait_timeout_seconds = 13;

  bool autostart = 14;
  RestartPolicy restart_policy = 15;
}

message LaunchProgress {
  oneof event {
    string status = 1;   // human-readable phase, e.g. "downloading image", "booting"
    int32 percent = 2;   // 0-100 for the current phase, when known
    Instance instance = 3; // final event on success
    string error = 4;
  }
}

message ForkRequest {
  string name = 1;     // source instance name
  string new_name = 2; // name for the forked instance
  bool start = 3;      // start the forked instance immediately after creating it
}

message ListRequest {
  Kind kind_filter = 1; // KIND_UNSPECIFIED means "all"
}

message ListReply {
  repeated Instance instances = 1;
}

message InfoRequest {
  repeated string names = 1;
}

message InfoReply {
  repeated Instance instances = 1;
}

message StartRequest {
  repeated string names = 1;
}

message StartReply {}

message StopRequest {
  repeated string names = 1;
  bool force = 2;
  int64 timeout_seconds = 3;
}

message StopReply {}

message DeleteRequest {
  repeated string names = 1;
  bool purge = 2;
}

message DeleteReply {}

message PurgeRequest {
  repeated string names = 1; // empty means purge everything pending
}

message PurgeReply {}

message LogsRequest {
  string name = 1;
  bool follow = 2;      // keep streaming as new output arrives, like `tail -f`
  int32 tail_lines = 3; // 0 means "from the beginning"
}

// LogChunk carries one piece of a VM's console output or a container's stdout/stderr.
message LogChunk {
  bytes data = 1;
}

// CloudInitService manages the saved cloud-init user-data library.
service CloudInitService {
  rpc List(CloudInitListRequest) returns (CloudInitListReply);
  rpc Get(CloudInitGetRequest) returns (CloudInitGetReply);
  rpc Save(CloudInitSaveRequest) returns (CloudInitSaveReply); // creates or updates
  rpc Rename(CloudInitRenameRequest) returns (CloudInitRenameReply);
  rpc Delete(CloudInitDeleteRequest) returns (CloudInitDeleteReply);

  // ImportRepo fetches a template-repo manifest and saves every listed
  // template into the library. See docs/mirrors.md for the manifest shape.
  rpc ImportRepo(CloudInitImportRepoRequest) returns (stream CloudInitImportRepoProgress);
}

message CloudInitConfigInfo {
  string name = 1;
  int64 modified_at_unix = 2;
}

message CloudInitListRequest {}

message CloudInitListReply {
  repeated CloudInitConfigInfo configs = 1;
}

message CloudInitGetRequest {
  string name = 1;
}

message CloudInitGetReply {
  string name = 1;
  string content = 2;
  int64 modified_at_unix = 3;
}

message CloudInitSaveRequest {
  string name = 1;
  string content = 2;
}

message CloudInitSaveReply {}

message CloudInitRenameRequest {
  string old_name = 1;
  string new_name = 2;
}

message CloudInitRenameReply {}

message CloudInitDeleteRequest {
  string name = 1;
}

message CloudInitDeleteReply {}

message CloudInitImportRepoRequest {
  string manifest_url = 1;
  bool force = 2; // overwrite a name already in the library; default skips it
}

message CloudInitImportRepoProgress {
  oneof event {
    string status = 1;                  // human-readable phase, e.g. "fetching nginx"
    CloudInitImportResult imported = 2; // one template's own result, as it finishes
    string error = 3;                   // a manifest fetch/parse failure; ends the stream
  }
}

// CloudInitImportResult is one template's own outcome within an ImportRepo call.
message CloudInitImportResult {
  string name = 1;
  bool skipped = 2; // true: already existed in the library and force wasn't set
  string error = 3; // set if fetching/saving this template failed
}

// MirrorService manages runtime-added VM image and container registry mirrors.
service MirrorService {
  rpc Add(MirrorAddRequest) returns (MirrorAddReply);
  rpc List(MirrorListRequest) returns (MirrorListReply);
  rpc Remove(MirrorRemoveRequest) returns (MirrorRemoveReply);
  rpc SetEnabled(MirrorSetEnabledRequest) returns (MirrorSetEnabledReply);
}

enum MirrorKind {
  MIRROR_KIND_UNSPECIFIED = 0;
  MIRROR_KIND_VM = 1;
  MIRROR_KIND_CONTAINER = 2;
}

message Mirror {
  string name = 1;
  MirrorKind kind = 2;
  string manifest_url = 3; // VM mirrors: a distribution-info.json-shaped manifest
  string registry = 4;     // container mirrors: host[:port]
  string mirror_of = 5;    // container mirrors: upstream registry this mirrors, optional
  bool insecure = 6;       // container mirrors: skip TLS verification
  int32 priority = 7;      // higher wins on a name/version/arch collision
  bool enabled = 8;
}

message MirrorAddRequest {
  Mirror mirror = 1;
}

message MirrorAddReply {}

message MirrorListRequest {
  MirrorKind kind_filter = 1; // MIRROR_KIND_UNSPECIFIED means "all"
}

message MirrorListReply {
  repeated Mirror mirrors = 1;
}

message MirrorRemoveRequest {
  string name = 1;
}

message MirrorRemoveReply {}

message MirrorSetEnabledRequest {
  string name = 1;
  bool enabled = 2;
}

message MirrorSetEnabledReply {}

// ImageService manages the on-disk cache of downloaded VM base images.
service ImageService {
  rpc List(ImageListRequest) returns (ImageListReply);
  rpc Delete(ImageDeleteRequest) returns (ImageDeleteReply);

  // Catalog lists every distro image `anvil launch --kind vm <id>` can resolve against.
  rpc Catalog(CatalogRequest) returns (CatalogReply);

  // ListContainerImages lists every image cached by a container engine
  // (Docker today), separate from the VM image cache above.
  rpc ListContainerImages(ContainerImageListRequest) returns (ContainerImageListReply);
  rpc DeleteContainerImage(ContainerImageDeleteRequest) returns (ContainerImageDeleteReply);

  // Checksum returns the SHA256 of a cached base image, without downloading it.
  // Migration uses it to decide if only a disk delta needs to be sent.
  rpc Checksum(ImageChecksumRequest) returns (ImageChecksumReply);
}

message ImageChecksumRequest {
  string id = 1;   // catalog id, e.g. "ubuntu-24.04"
  string arch = 2; // defaults to "x86_64"
}

message ImageChecksumReply {
  bool cached = 1;    // false if this host has no copy of the image yet
  string sha256 = 2;  // hex, set when cached is true
}

message CachedImage {
  string id = 1;
  string arch = 2;
  string path = 3;
  int64 size_bytes = 4;
  int32 ref_count = 5; // number of instances whose disk is backed by this image
}

message ImageListRequest {}

message ImageListReply {
  repeated CachedImage images = 1;
}

// CatalogEntry is one fetchable distro image.
message CatalogEntry {
  string id = 1;      // e.g. "ubuntu-24.04": what `anvil launch --kind vm <id>` takes
  string name = 2;    // e.g. "Ubuntu 24.04 LTS"
  string distro = 3;
  string version = 4;
  string arch = 5;
  int64 min_disk_gib = 6;
  string default_user = 7;
}

message CatalogRequest {}

message CatalogReply {
  repeated CatalogEntry entries = 1;
}

message ImageDeleteRequest {
  string id = 1;
  string arch = 2; // optional; only needed if id is ambiguous across architectures
  bool force = 3;  // delete even if ref_count > 0, which will break those instances' disks
}

// ContainerImage is one image cached by a container engine, a separate
// inventory from CachedImage's VM disk images above.
message ContainerImage {
  string id = 1;
  ContainerEngine engine = 2;
  repeated string repo_tags = 3; // e.g. "nginx:alpine"; empty for a dangling/untagged image
  int64 size_bytes = 4;
  int32 ref_count = 5; // number of containers (running or not) using this image
}

message ContainerImageListRequest {}

message ContainerImageListReply {
  repeated ContainerImage images = 1;
}

message ContainerImageDeleteRequest {
  string id = 1;
  ContainerEngine engine = 2;
  bool force = 3; // delete even if ref_count > 0
}

message ContainerImageDeleteReply {}

message ImageDeleteReply {}

message MountRequest {
  string name = 1;
  string host_path = 2;
  string guest_path = 3;
  bool read_only = 4;
}

message MountReply {}

message UmountRequest {
  string name = 1;
  string guest_path = 2;
}

message UmountReply {}

// IntentService manages named groups of VM/container instances. Members are
// created via InstanceService.Launch(intent_name, role); this service only reads and manages the group afterward.
service IntentService {
  rpc List(IntentListRequest) returns (IntentListReply);
  rpc Info(IntentInfoRequest) returns (IntentInfoReply);
  rpc Remove(IntentRemoveRequest) returns (IntentRemoveReply);
  rpc Delete(IntentDeleteRequest) returns (IntentDeleteReply);

  // Apply compares a manifest (anvil.yaml) with the intent's current state and applies the
  // difference. The plan is always sent first; dry_run stops there.
  rpc Apply(IntentApplyRequest) returns (stream IntentApplyProgress);
}

message IntentMember {
  string instance_id = 1;
  string role = 2;
  Kind kind = 3;
  string ip = 4;       // address on the intent's network, empty without one
  string dns_name = 5; // e.g. "db.myapp.anvil", resolvable by every other member
}

message Intent {
  string id = 1;
  string name = 2;
  repeated IntentMember members = 3;
  IntentNetwork network = 4; // unset until the first member is launched
}

// IntentNetwork is the shared bridge network created for one intent.
message IntentNetwork {
  string engine_network_name = 1; // Docker/Podman network name
  string bridge_interface = 2;    // underlying Linux bridge interface name
  string subnet = 3;              // CIDR, e.g. "10.55.201.0/24"
  string gateway = 4;
  string docker_ip_range = 5; // CIDR sub-range reserved for the engine's own IPAM
  string dns_domain = 6;      // zone members are named in, e.g. "myapp.anvil"
  string dns_server = 7;      // address members send DNS queries to
}

message IntentListRequest {}

message IntentListReply {
  repeated Intent intents = 1;
}

message IntentInfoRequest {
  string name = 1;
}

message IntentInfoReply {
  Intent intent = 1;
}

// Remove ungroups member (by instance ID or role) without deleting the underlying instance.
message IntentRemoveRequest {
  string name = 1;
  string member = 2;
}

message IntentRemoveReply {
  Intent intent = 1;
}

message IntentDeleteRequest {
  string name = 1;
  bool purge_members = 2; // also delete every member instance, not just the group record
}

message IntentDeleteReply {
  Intent intent = 1;
}

message IntentApplyRequest {
  bytes manifest = 1;               // anvil.yaml content
  bool dry_run = 2;                 // only send the plan
  bool prune = 3;                   // delete members that are no longer in the manifest
  bool recreate = 4;                // allow replacing a VM, which loses its disk
  repeated string ssh_public_keys = 5; // authorized on every new VM, e.g. the caller's anvil key
  int32 wait_timeout_seconds = 6;   // readiness wait per depended-on member, defaults to 900
}

// IntentApplyStep is one planned change to a member.
message IntentApplyStep {
  string role = 1;
  string instance_name = 2;
  string action = 3;           // "create" | "recreate" | "update" | "start" | "keep" | "delete"
  repeated string changes = 4; // why, one short line per difference
}

message IntentApplyPlan {
  string intent_name = 1;
  repeated IntentApplyStep steps = 2;
}

message IntentApplyProgress {
  oneof event {
    IntentApplyPlan plan = 1; // always the first event
    string status = 2;
    Intent intent = 3;        // final event on success, unset on a dry run
    string error = 4;
  }
}

// HostService manages the known-hosts list migration targets are resolved
// against. Adding a host grants no trust by itself, it's just a saved shortcut.
service HostService {
  rpc Add(HostAddRequest) returns (HostAddReply);
  rpc List(HostListRequest) returns (HostListReply);
  rpc Remove(HostRemoveRequest) returns (HostRemoveReply);
  rpc Test(HostTestRequest) returns (HostTestReply); // checks real SSH reachability

  // Discover lists other anvil hosts announcing themselves on the local
  // network over mDNS. Nothing is saved and no trust is granted, it just
  // fills in what `anvil host add` would otherwise have to be told.
  rpc Discover(HostDiscoverRequest) returns (HostDiscoverReply);
}

message Host {
  string alias = 1;
  string target = 2;   // "user@host[:port]"
  string identity = 3; // optional path to a private key

  // Requires this host's SSH key to already be in anvil's own known_hosts file,
  // instead of trusting whatever key answers the first time.
  bool strict_host_key = 4;
}

message HostAddRequest {
  Host host = 1;
}

message HostAddReply {}

message HostListRequest {}

message HostListReply {
  repeated Host hosts = 1;
}

message HostRemoveRequest {
  string alias = 1;
}

message HostRemoveReply {}

message HostTestRequest {
  string alias = 1;
}

message HostTestReply {
  bool ok = 1;
  string message = 2; // human-readable detail either way
}

message HostDiscoverRequest {
  int32 timeout_seconds = 1; // 0 uses the daemon's own default
}

message DiscoveredHost {
  string name = 1;     // the remote host's own hostname
  string address = 2;  // address it answered from
  int32 ssh_port = 3;
}

message HostDiscoverReply {
  repeated DiscoveredHost hosts = 1;
}

// MigrateService moves a single instance or a whole intent to a different
// anvil host over SSH, with no daemon-to-daemon gRPC trust required.
service MigrateService {
  rpc Migrate(MigrateRequest) returns (stream MigrateProgress);

  // Key returns anvild's own public key for its outbound migration SSH connections.
  rpc Key(MigrateKeyRequest) returns (MigrateKeyReply);

  // GuestKey returns the target host's own default guest-access public key,
  // so it can be authorized in a VM before migrating it.
  rpc GuestKey(MigrateGuestKeyRequest) returns (MigrateGuestKeyReply);
}

message MigrateKeyRequest {}

message MigrateKeyReply {
  string public_key = 1;
}

message MigrateGuestKeyRequest {
  string to = 1; // same resolution as MigrateRequest.to
}

message MigrateGuestKeyReply {
  string public_key = 1;
}

message MigrateRequest {
  string name = 1; // resolved as a single instance first, a whole intent second
  string to = 2;   // a known host's alias, or a literal "user@host[:port]"

  // Default mode is destructive: copy, verify, then delete the source. copy skips the delete.
  bool copy = 3;

  string dest_name = 4; // single-instance migration only
  bool dry_run = 5;     // validate connectivity/preconditions, transfer nothing

  // Intent migration only: keep whatever members succeed instead of
  // rolling back the whole group on the first failure.
  bool best_effort = 6;
}

message MigrateProgress {
  oneof event {
    string status = 1;
    string error = 2;
    string done = 3; // single-instance migration: the new instance's ID on the target

    // Sent once per member, right after a whole-intent migration finishes.
    MigrateMemberResult member_done = 4;

    // The whole-intent migration's terminal event.
    IntentMigrateDone intent_done = 5;
  }
}

// MigrateMemberResult is one intent member's own migration outcome.
message MigrateMemberResult {
  string role = 1;
  string new_id = 2; // set when this member migrated successfully
  string error = 3;  // set when it didn't
}

// IntentMigrateDone is a whole-intent migration's final summary.
message IntentMigrateDone {
  string intent_name = 1;
  repeated MigrateMemberResult members = 2;
  bool rolled_back = 3; // true if an all-or-nothing migration hit a member failure and was undone
}

// ExportService packages a single instance or a whole intent into a portable tar.zst bundle, and relaunches one back from it.
// Unlike MigrateService, both ends run against this same anvild, so bundle_path/output_path are plain local filesystem paths.
service ExportService {
  rpc Export(ExportRequest) returns (stream ExportProgress);
  rpc Import(ImportRequest) returns (stream ImportProgress);
}

message ExportRequest {
  string name = 1;        // resolved as a single instance first, a whole intent second, unless is_intent
  string output_path = 2; // where to write the bundle, e.g. "/home/me/bundle.tar.zst"

  // is_intent skips instance resolution and looks name up as an intent only.
  // Lets a caller that already knows name is an intent (the TUI's Intents page) avoid being shadowed by an unrelated instance of the same name.
  bool is_intent = 3;
}

message ExportProgress {
  oneof event {
    string status = 1;
    string done = 2; // the bundle's final path
    string error = 3;
  }
}

message ImportRequest {
  string bundle_path = 1;
  string name = 2; // renames the imported intent, or the instance for a standalone bundle
}

message ImportMemberResult {
  string role = 1;
  string new_id = 2; // set when this member imported successfully
  string error = 3;  // set when it didn't
}

message ImportProgress {
  oneof event {
    string status = 1;
    string error = 2;
    ImportDone done = 3;
  }
}

// ImportDone is Import's final summary: intent_name is empty for a
// standalone instance bundle, and members has exactly one entry.
message ImportDone {
  string intent_name = 1;
  repeated ImportMemberResult members = 2;
}

// SnapshotService manages QCOW2 internal snapshots of a VM's disk, a point-in-time checkpoint that can be restored in place later. VM only.
// Create/Delete apply live over QMP; Restore stops the instance first and restarts it afterward if it was running.
service SnapshotService {
  rpc Create(SnapshotCreateRequest) returns (SnapshotCreateReply);
  rpc Restore(SnapshotRestoreRequest) returns (SnapshotRestoreReply);
  rpc Delete(SnapshotDeleteRequest) returns (SnapshotDeleteReply);
  rpc List(SnapshotListRequest) returns (SnapshotListReply);

  // SetSchedule sets (or, with every_seconds 0, removes) a VM's scheduled snapshots.
  rpc SetSchedule(SnapshotSetScheduleRequest) returns (SnapshotSetScheduleReply);
}

message SnapshotSetScheduleRequest {
  string name = 1;
  int64 every_seconds = 2; // 0 removes the schedule; at least 60 otherwise
  int32 keep = 3;          // at least 1
}

message SnapshotSetScheduleReply {}

message SnapshotCreateRequest {
  string name = 1; // instance name
  string snapshot_name = 2;
}

message SnapshotCreateReply {}

message SnapshotRestoreRequest {
  string name = 1;
  string snapshot_name = 2;
}

message SnapshotRestoreReply {}

message SnapshotDeleteRequest {
  string name = 1;
  string snapshot_name = 2;
}

message SnapshotDeleteReply {}

message SnapshotListRequest {
  string name = 1;
}

message SnapshotInfo {
  string name = 1;
  int64 created_at_unix = 2;

  // has_vm_state is true for a snapshot taken live (embeds VM state alongside the disk data), false for disk-only.
  // Informational only: restore always resets disk content regardless of this field.
  bool has_vm_state = 3;
}

message SnapshotListReply {
  repeated SnapshotInfo snapshots = 1;
}
