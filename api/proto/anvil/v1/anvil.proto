syntax = "proto3";

package anvil.v1;

option go_package = "git.fferrando.cc/rdfilippo/anvil/api/gen/anvil/v1;anvilv1";

// InstanceService manages the lifecycle of VM and container instances.
service InstanceService {
  rpc Launch(LaunchRequest) returns (stream LaunchProgress);

  // Fork creates a new instance whose disk starts as a copy of an existing
  // instance's disk, preserving the same backing file. Safe to call while the source is running; VM instances only.
  rpc Fork(ForkRequest) returns (stream LaunchProgress);

  rpc List(ListRequest) returns (ListReply);
  rpc Info(InfoRequest) returns (InfoReply);
  rpc Start(StartRequest) returns (StartReply);
  rpc Stop(StopRequest) returns (StopReply);
  rpc Delete(DeleteRequest) returns (DeleteReply);
  rpc Logs(LogsRequest) returns (stream LogChunk);
  rpc Mount(MountRequest) returns (MountReply);
  rpc Umount(UmountRequest) returns (UmountReply);

  // AddPort/RemovePort change a running instance's port forwards without recreating it: a VM applies this live over QMP.
  // A container recreates its underlying container instead (Docker has no live port-binding mutation), restarting it if it was running.
  rpc AddPort(AddPortRequest) returns (AddPortReply);
  rpc RemovePort(RemovePortRequest) returns (RemovePortReply);

  // Stats returns a live resource-usage snapshot for a running instance.
  rpc Stats(StatsRequest) returns (StatsReply);

  // StreamStats sends a Stats snapshot every interval. The stream ends cleanly once the instance stops.
  rpc StreamStats(StreamStatsRequest) returns (stream StatsReply);

  // Events streams the persisted event log, oldest first; with follow, new events as they happen.
  rpc Events(EventsRequest) returns (stream InstanceEvent);

  // Watch streams instance changes (create, state/config change, delete) as they happen.
  // Events are change hints: a client that falls far behind may miss some.
  rpc Watch(WatchRequest) returns (stream WatchEvent);

  // WaitReady streams progress until a running instance's first-boot setup (cloud-init
  // for a VM) finished. Ends with an Instance event, or an Error one on failure or timeout.
  rpc WaitReady(WaitReadyRequest) returns (stream LaunchProgress);

  // Update changes an existing instance's settings; unset fields stay as they are.
  // CPU and memory of a running VM change live when possible, else at its next start (see restart_pending).
  rpc Update(UpdateRequest) returns (UpdateReply);

  // PrepareGUI gets an instance ready to show GUI apps on the host (starting it if
  // stopped) and ends with a GUISession event, or an Error one.
  rpc PrepareGUI(PrepareGUIRequest) returns (stream PrepareGUIProgress);

  // GetGUIAppInfo finds an app's desktop entry name and icon inside a GUI-enabled instance.
  rpc GetGUIAppInfo(GUIAppInfoRequest) returns (GUIAppInfoReply);

  // Version reports the daemon's build version.
  rpc Version(VersionRequest) returns (VersionReply);
}

message PrepareGUIRequest {
  string name = 1;
  bool x11 = 2; // also prepare XWayland for X11 apps
}

message PrepareGUIProgress {
  oneof event {
    string status = 1;
    GUISession session = 2; // final event on success
    string error = 3;
  }
}

// GUISession is what the client needs to connect an instance's apps to the host's display.
message GUISession {
  Instance instance = 1;

  // Container only: host directories bind-mounted at /run/anvil-gui and /tmp/.X11-unix.
  string relay_dir = 2;
  string x11_dir = 3;

  // VM only: where the shipped waypipe and xwayland-satellite are in the guest.
  string guest_tools_dir = 4;
}

message GUIAppInfoRequest {
  string name = 1;    // instance name
  string command = 2; // the app's command, e.g. "ghidraRun" or "/usr/bin/gimp"
}

message GUIAppInfoReply {
  bool found = 1;           // a matching desktop entry was found
  string app_name = 2;      // its Name=
  bytes icon = 3;           // empty when no icon file was found
  string icon_ext = 4;      // "png" or "svg"
  int32 icon_size = 5;      // pixel size of a png icon, 0 for svg
}

message UpdateRequest {
  string name = 1;
  optional int32 cpus = 2;        // VM only
  optional int64 memory_mib = 3;  // VM only
  optional int64 disk_gib = 4;    // VM only, grow only; live on a running VM
  optional bool autostart = 5;
  RestartPolicy restart_policy = 6; // unset = unchanged
}

message UpdateReply {
  Instance instance = 1;
  bool restart_pending = 2; // some changes wait for the next start of the running VM
  repeated string notes = 3; // what was applied and how, for display
}

message WaitReadyRequest {
  string name = 1;
  int32 timeout_seconds = 2; // defaults to 900
}

message WatchRequest {
  bool include_existing = 1; // first send one UPDATED event per existing instance
}

enum WatchEventType {
  WATCH_EVENT_TYPE_UNSPECIFIED = 0;
  WATCH_EVENT_TYPE_UPDATED = 1;
  WATCH_EVENT_TYPE_DELETED = 2;
}

message WatchEvent {
  WatchEventType type = 1;
  Instance instance = 2; // for DELETED only id, name and kind are set
}

message AddPortRequest {
  string name = 1;
  PortMapping port = 2;
}

message AddPortReply {}

message RemovePortRequest {
  string name = 1;
  int32 host_port = 2;
  string protocol = 3; // "tcp" | "udp", empty defaults to "tcp"
}

message RemovePortReply {}

message StatsRequest {
  string name = 1;
}

// InstanceStats is a point-in-time resource-usage reading for one running instance.
message InstanceStats {
  double cpu_percent = 1; // normalized to the instance's own CPU allocation (100% = fully using every assigned CPU)

  int64 mem_used_bytes = 2;
  int64 mem_limit_bytes = 3;

  // Disk space: VM only (the provisioned qcow2). disk_total_bytes of 0
  // means space usage isn't available for this instance.
  int64 disk_used_bytes = 4;
  int64 disk_total_bytes = 5;

  // Disk I/O rate: container only, averaged over a short live sample.
  double disk_read_bytes_per_sec = 6;
  double disk_write_bytes_per_sec = 7;

  // Network throughput, averaged over a short live sample. Not available
  // for a VM using SLIRP networking (no host-visible interface to sample).
  bool net_available = 8;
  double net_rx_bytes_per_sec = 9;
  double net_tx_bytes_per_sec = 10;

  int64 uptime_seconds = 11;
  string address = 12; // best-known reachable address; empty if unknown
}

message StatsReply {
  InstanceStats stats = 1;
}

message StreamStatsRequest {
  string name = 1;
  int32 interval_ms = 2; // 0 defaults to 2000; values under 500 are raised to 500
}

message EventsRequest {
  string name = 1;  // only this instance's events; empty for every instance
  int32 limit = 2;  // send only the newest limit stored events; 0 sends all of them
  bool follow = 3;  // after the stored events, keep sending new ones
}

// InstanceEvent is one entry of the event log: an operation on an instance, or a change made outside anvil.
message InstanceEvent {
  uint64 seq = 1;          // grows by one per event, oldest first
  int64 time_unix = 2;
  string instance_id = 3;  // empty when the operation failed before an instance existed
  string instance_name = 4;
  Kind kind = 5;
  string action = 6;       // e.g. "launch", "start", "stop", "exit", "restart", "snapshot-create"
  string actor = 7;        // the caller's user name, or "anvild" for the daemon's own actions
  string message = 8;
  string error = 9;        // set when the operation failed
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_VM = 1;
  KIND_CONTAINER = 2;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_STOPPED = 1;
  STATE_STARTING = 2;
  STATE_RUNNING = 3;
  STATE_STOPPING = 4;
  STATE_DELETING = 5;
  STATE_DELETED = 6; // left by older versions only; anvild removes such records at startup
  STATE_ERROR = 7;
}

message VMSpec {
  string image_ref = 1;
  string arch = 2;
  int32 cpus = 3;
  int64 memory_mib = 4;
  int64 disk_gib = 5;
  string cloud_init_user_data = 6;
  string cloud_init_name = 7; // reference into the saved cloud-init library
  string network_mode = 8;    // "slirp" | "bridge"
  repeated string ssh_public_keys = 9;

  // Daemon-populated: the allocated SSH host-forward port and the image's default user.
  int32 ssh_port = 10;
  string default_user = 11;

  // Host directories shared into the guest via virtiofs, managed by InstanceService.Mount/Umount.
  repeated Mount mounts = 12;

  // Daemon-populated when this VM joins an intent's bridge network, or for a standalone
  // Firecracker VM. On Launch, static_ip is read only for a migrated Firecracker disk.
  string bridge_interface = 13; // Linux interface name of the intent's shared bridge
  string static_ip = 14;        // CIDR, e.g. "10.55.201.4/24"
  string gateway = 15;

  // Ports to publish from the host into the guest; only meaningful in SLIRP mode.
  repeated PortMapping ports = 16;

  // Daemon-populated: every other intent member's role -> static IP at launch time.
  map<string, string> extra_hosts = 17;

  // Set only when relaunching a migrated instance: adopts this disk directly, skipping cloud-init.
  string source_disk_path = 18;

  // Set with source_disk_path when that disk is only a delta on top of the base image with
  // this SHA256; the daemon rebases it onto its own identical copy of that base.
  string source_disk_base_sha256 = 19;

  // Skips installing qemu-guest-agent through cloud-init. Without it, IP reporting,
  // agent shutdown and precise cloud-init status aren't available.
  bool no_guest_agent = 20;

  SnapshotSchedule snapshot_schedule = 21;

  // Set with source_disk_base_sha256 when the base image itself travelled with the
  // disk, because the target didn't have it cached. Adopted before the rebase.
  string source_base_image_path = 22;

  // The guest NIC's MAC address. Kept across migration and import, since the guest's
  // network config matches on it. Empty on input means derived from the instance ID.
  string mac_address = 23;

  // Which hypervisor runs this VM; unspecified means QEMU.
  VmHypervisor hypervisor = 24;

  // Host devices passed to the guest (QEMU only, set at launch): "usb:<vendor>:<product>",
  // "usb:<bus>-<port>" or "pci:<domain>:<bus>:<slot>.<fn>". Such a VM can't be migrated or forked.
  repeated string devices = 25;
}

enum VmHypervisor {
  VM_HYPERVISOR_UNSPECIFIED = 0;
  VM_HYPERVISOR_QEMU = 1;
  VM_HYPERVISOR_FIRECRACKER = 2;
}

// Mount is one host directory shared into a VM's guest over virtiofs.
message Mount {
  string host_path = 1;
  string guest_path = 2;
  string tag = 3; // internal virtiofs tag, assigned automatically
  bool read_only = 4;

  // Set only when relaunching a migrated VM: the shared folder's contents were
  // uploaded here, and are moved into place before the mount is recreated.
  string source_data_path = 5;
}

enum ContainerEngine {
  CONTAINER_ENGINE_UNSPECIFIED = 0;
  CONTAINER_ENGINE_DOCKER = 1;
  CONTAINER_ENGINE_PODMAN = 2;
}

message ContainerSpec {
  string image_ref = 1;
  map<string, string> env = 2;
  repeated string entrypoint = 3;
  repeated string cmd = 4;
  repeated VolumeMount volumes = 5;
  repeated PortMapping ports = 6;
  string network_mode = 7;
  ContainerEngine engine = 8;

  // Daemon-populated: the engine's own container ID, set at create time.
  string container_id = 9;

  // Daemon-populated when this container joins an intent's network.
  string network_alias = 10;
  map<string, string> extra_hosts = 11;
}

message VolumeMount {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;

  // Same as Mount.source_data_path, for a migrated container's bind mount.
  string source_data_path = 4;
}

message PortMapping {
  int32 host_port = 1;
  int32 guest_port = 2;
  string protocol = 3; // "tcp" | "udp"
}

message Instance {
  string id = 1;
  string name = 2;
  Kind kind = 3;
  State state = 4;
  int64 created_at_unix = 5;
  map<string, string> labels = 6;
  VMSpec vm = 7;
  ContainerSpec container = 8;

  // Daemon-populated, live: what the guest agent last reported. Unset when unknown.
  GuestInfo guest = 9;

  // autostart starts the instance when anvild starts, unless it was last stopped on purpose.
  bool autostart = 10;
  RestartPolicy restart_policy = 11;

  // Daemon-populated: the instance can show GUI apps on the host (`anvil gui`).
  bool gui_enabled = 12;
}

// RestartPolicy says what anvild does when an instance stops without being asked to.
message RestartPolicy {
  string mode = 1;        // "no" (default), "on-failure" (exited with an error), "always"
  int32 max_retries = 2;  // on-failure only: give up after this many restarts in a row; 0 = no limit
}

// SnapshotSchedule takes a live snapshot of a running VM every interval, keeping the newest ones.
message SnapshotSchedule {
  int64 every_seconds = 1;  // 0 = no schedule
  int32 keep = 2;           // scheduled snapshots to keep; older ones are deleted
  int64 last_run_unix = 3;  // daemon-populated
}

enum CloudInitStatus {
  CLOUD_INIT_STATUS_UNSPECIFIED = 0; // unknown, e.g. no guest agent yet
  CLOUD_INIT_STATUS_RUNNING = 1;
  CLOUD_INIT_STATUS_DONE = 2;
  CLOUD_INIT_STATUS_ERROR = 3;
  CLOUD_INIT_STATUS_DISABLED = 4; // nothing to do this boot, e.g. a migrated disk
}

// GuestInfo is what a VM's qemu-guest-agent reports about the running guest.
message GuestInfo {
  bool agent_connected = 1;
  repeated string ip_addresses = 2; // CIDR form, loopback and link-local left out
  CloudInitStatus cloud_init = 3;
}

message LaunchRequest {
  string name = 1;
  Kind kind = 2;
  VMSpec vm = 3;
  ContainerSpec container = 4;

  // When set, this launch joins (or creates) that intent as a member instead
  // of producing a standalone instance.
  string intent_name = 5;
  string role = 6;

  bool no_start = 7;

  // Internal only: used by `anvil migrate-import` to pin a relaunched
  // intent member to its exact original network.
  string pinned_subnet = 8;
  string pinned_gateway = 9;
  string pinned_docker_ip_range = 10;
  string pinned_static_ip = 11;

  // wait keeps the stream open after the instance started, until its first-boot setup
  // (cloud-init for a VM) finished. wait_timeout_seconds defaults to 900.
  bool wait = 12;
  int32 wait_timeout_seconds = 13;

  bool autostart = 14;
  RestartPolicy restart_policy = 15;
}

message LaunchProgress {
  oneof event {
    string status = 1;   // human-readable phase, e.g. "downloading image", "booting"
    int32 percent = 2;   // 0-100 for the current phase, when known
    Instance instance = 3; // final event on success
    string error = 4;
  }
}

message ForkRequest {
  string name = 1;     // source instance name
  string new_name = 2; // name for the forked instance
  bool start = 3;      // start the forked instance immediately after creating it
}

message ListRequest {
  Kind kind_filter = 1; // KIND_UNSPECIFIED means "all"
}

message ListReply {
  repeated Instance instances = 1;
}

message InfoRequest {
  repeated string names = 1;
}

message InfoReply {
  repeated Instance instances = 1;
}

message StartRequest {
  repeated string names = 1;
}

message StartReply {}

message StopRequest {
  repeated string names = 1;
  bool force = 2;
  int64 timeout_seconds = 3;
}

message StopReply {}

message DeleteRequest {
  repeated string names = 1;
  // Also removes a VM's cached base image when no other instance uses it.
  bool purge = 2;
}

message DeleteReply {}

message LogsRequest {
  string name = 1;
  bool follow = 2;      // keep streaming as new output arrives, like `tail -f`
  int32 tail_lines = 3; // 0 means "from the beginning"
}

// LogChunk carries one piece of a VM's console output or a container's stdout/stderr.
message LogChunk {
  bytes data = 1;
}

// CloudInitService manages the saved cloud-init user-data library.
service CloudInitService {
  rpc List(CloudInitListRequest) returns (CloudInitListReply);
  rpc Get(CloudInitGetRequest) returns (CloudInitGetReply);
  rpc Save(CloudInitSaveRequest) returns (CloudInitSaveReply); // creates or updates
  rpc Rename(CloudInitRenameRequest) returns (CloudInitRenameReply);
  rpc Delete(CloudInitDeleteRequest) returns (CloudInitDeleteReply);

  // ImportRepo fetches a template-repo manifest and saves every listed
  // template into the library. See docs/mirrors.md for the manifest shape.
  rpc ImportRepo(CloudInitImportRepoRequest) returns (stream CloudInitImportRepoProgress);

  // Generate renders a quick-start #cloud-config and saves it when save_as is set.
  rpc Generate(CloudInitGenerateRequest) returns (CloudInitGenerateReply);
}

message CloudInitConfigInfo {
  string name = 1;
  int64 modified_at_unix = 2;
}

message CloudInitListRequest {}

message CloudInitListReply {
  repeated CloudInitConfigInfo configs = 1;
}

message CloudInitGetRequest {
  string name = 1;
}

message CloudInitGetReply {
  string name = 1;
  string content = 2;
  int64 modified_at_unix = 3;
}

message CloudInitSaveRequest {
  string name = 1;
  string content = 2;
}

message CloudInitSaveReply {}

message CloudInitRenameRequest {
  string old_name = 1;
  string new_name = 2;
}

message CloudInitRenameReply {}

message CloudInitDeleteRequest {
  string name = 1;
}

message CloudInitDeleteReply {}

message CloudInitImportRepoRequest {
  string manifest_url = 1;
  bool force = 2; // overwrite a name already in the library; default skips it
}

message CloudInitImportRepoProgress {
  oneof event {
    string status = 1;                  // human-readable phase, e.g. "fetching nginx"
    CloudInitImportResult imported = 2; // one template's own result, as it finishes
    string error = 3;                   // a manifest fetch/parse failure; ends the stream
  }
}

message CloudInitGenerateRequest {
  string user = 1;                  // default user with passwordless sudo; empty adds no user
  repeated string ssh_keys = 2;     // public key lines for that user, not file paths
  repeated string packages = 3;
  repeated string run_commands = 4; // runcmd entries, one shell command each
  string save_as = 5;               // library name to save under; empty only renders
}

message CloudInitGenerateReply {
  string content = 1;
}

// CloudInitImportResult is one template's own outcome within an ImportRepo call.
message CloudInitImportResult {
  string name = 1;
  bool skipped = 2; // true: already existed in the library and force wasn't set
  string error = 3; // set if fetching/saving this template failed
}

// ManifestService manages the saved library of intent manifests (anvil.yaml).
// A saved manifest is applied by sending its content to IntentService.Apply.
service ManifestService {
  rpc List(ManifestListRequest) returns (ManifestListReply);
  rpc Get(ManifestGetRequest) returns (ManifestGetReply);
  rpc Save(ManifestSaveRequest) returns (ManifestSaveReply); // creates or updates
  rpc Rename(ManifestRenameRequest) returns (ManifestRenameReply);
  rpc Delete(ManifestDeleteRequest) returns (ManifestDeleteReply);
}

message ManifestInfo {
  string name = 1;
  int64 modified_at_unix = 2;
  string intent = 3; // the manifest's intent: field, empty if it can't be read
}

message ManifestListRequest {}

message ManifestListReply {
  repeated ManifestInfo manifests = 1;
}

message ManifestGetRequest {
  string name = 1;
}

message ManifestGetReply {
  ManifestInfo info = 1;
  string content = 2;
}

message ManifestSaveRequest {
  string name = 1;
  string content = 2;
}

message ManifestSaveReply {}

message ManifestRenameRequest {
  string old_name = 1;
  string new_name = 2;
}

message ManifestRenameReply {}

message ManifestDeleteRequest {
  string name = 1;
}

message ManifestDeleteReply {}

// MirrorService manages runtime-added VM image and container registry mirrors.
service MirrorService {
  rpc Add(MirrorAddRequest) returns (MirrorAddReply);
  rpc List(MirrorListRequest) returns (MirrorListReply);
  rpc Remove(MirrorRemoveRequest) returns (MirrorRemoveReply);
  rpc SetEnabled(MirrorSetEnabledRequest) returns (MirrorSetEnabledReply);
}

enum MirrorKind {
  MIRROR_KIND_UNSPECIFIED = 0;
  MIRROR_KIND_VM = 1;
  MIRROR_KIND_CONTAINER = 2;
}

message Mirror {
  string name = 1;
  MirrorKind kind = 2;
  string manifest_url = 3; // VM mirrors: a distribution-info.json-shaped manifest
  string registry = 4;     // container mirrors: host[:port]
  string mirror_of = 5;    // container mirrors: upstream registry this mirrors, optional
  bool insecure = 6;       // container mirrors: skip TLS verification
  int32 priority = 7;      // higher wins on a name/version/arch collision
  bool enabled = 8;
}

message MirrorAddRequest {
  Mirror mirror = 1;
}

message MirrorAddReply {}

message MirrorListRequest {
  MirrorKind kind_filter = 1; // MIRROR_KIND_UNSPECIFIED means "all"
}

message MirrorListReply {
  repeated Mirror mirrors = 1;
}

message MirrorRemoveRequest {
  string name = 1;
}

message MirrorRemoveReply {}

message MirrorSetEnabledRequest {
  string name = 1;
  bool enabled = 2;
}

message MirrorSetEnabledReply {}

// ImageService manages the on-disk cache of downloaded VM base images.
service ImageService {
  rpc List(ImageListRequest) returns (ImageListReply);
  rpc Delete(ImageDeleteRequest) returns (ImageDeleteReply);

  // Catalog lists every distro image `anvil launch --kind vm <id>` can resolve against.
  rpc Catalog(CatalogRequest) returns (CatalogReply);

  // ListContainerImages lists every image cached by a container engine
  // (Docker today), separate from the VM image cache above.
  rpc ListContainerImages(ContainerImageListRequest) returns (ContainerImageListReply);
  rpc DeleteContainerImage(ContainerImageDeleteRequest) returns (ContainerImageDeleteReply);

  // Checksum returns the SHA256 of a cached base image, without downloading it.
  // Migration uses it to decide if only a disk delta needs to be sent.
  rpc Checksum(ImageChecksumRequest) returns (ImageChecksumReply);
}

message ImageChecksumRequest {
  string id = 1;   // catalog id, e.g. "ubuntu-24.04"
  string arch = 2; // defaults to "x86_64"
}

message ImageChecksumReply {
  bool cached = 1;    // false if this host has no copy of the image yet
  string sha256 = 2;  // hex, set when cached is true
}

message CachedImage {
  string id = 1;
  string arch = 2;
  string path = 3;
  int64 size_bytes = 4;
  int32 ref_count = 5; // number of instances whose disk is backed by this image
  // "base" (a downloaded qcow2), "firecracker-raw" (its raw copy) or "firecracker-kernel".
  string kind = 6;
}

message ImageListRequest {}

message ImageListReply {
  repeated CachedImage images = 1;
}

// CatalogEntry is one fetchable distro image.
message CatalogEntry {
  string id = 1;      // e.g. "ubuntu-24.04": what `anvil launch --kind vm <id>` takes
  string name = 2;    // e.g. "Ubuntu 24.04 LTS"
  string distro = 3;
  string version = 4;
  string arch = 5;
  int64 min_disk_gib = 6;
  string default_user = 7;
  bool firecracker = 8; // also launches with --hypervisor firecracker
}

message CatalogRequest {}

message CatalogReply {
  repeated CatalogEntry entries = 1;
}

message ImageDeleteRequest {
  string id = 1;
  string arch = 2; // optional; only needed if id is ambiguous across architectures
  bool force = 3;  // delete even if ref_count > 0, which will break those instances' disks
  string kind = 4; // optional CachedImage.kind; empty picks the base image first
}

// ContainerImage is one image cached by a container engine, a separate
// inventory from CachedImage's VM disk images above.
message ContainerImage {
  string id = 1;
  ContainerEngine engine = 2;
  repeated string repo_tags = 3; // e.g. "nginx:alpine"; empty for a dangling/untagged image
  int64 size_bytes = 4;
  int32 ref_count = 5; // number of containers (running or not) using this image
}

message ContainerImageListRequest {}

message ContainerImageListReply {
  repeated ContainerImage images = 1;
}

message ContainerImageDeleteRequest {
  string id = 1;
  ContainerEngine engine = 2;
  bool force = 3; // delete even if ref_count > 0
}

message ContainerImageDeleteReply {}

message ImageDeleteReply {}

message MountRequest {
  string name = 1;
  string host_path = 2;
  string guest_path = 3;
  bool read_only = 4;
}

message MountReply {}

message UmountRequest {
  string name = 1;
  string guest_path = 2;
}

message UmountReply {}

// IntentService manages named groups of VM/container instances. Members are
// created via InstanceService.Launch(intent_name, role), AddMembers or Apply.
service IntentService {
  rpc List(IntentListRequest) returns (IntentListReply);
  rpc Info(IntentInfoRequest) returns (IntentInfoReply);
  rpc Remove(IntentRemoveRequest) returns (IntentRemoveReply);
  rpc Delete(IntentDeleteRequest) returns (IntentDeleteReply);

  // Apply compares a manifest (anvil.yaml) with the intent's current state and applies the
  // difference. The plan is always sent first; dry_run stops there.
  rpc Apply(IntentApplyRequest) returns (stream IntentApplyProgress);

  // AddMembers launches members into an intent one at a time, in order. The first failure
  // ends the stream with an error; members launched before it are kept, not rolled back.
  rpc AddMembers(IntentAddMembersRequest) returns (stream IntentAddMembersProgress);
}

message IntentMember {
  string instance_id = 1;
  string role = 2;
  Kind kind = 3;
  string ip = 4;       // address on the intent's network, empty without one
  string dns_name = 5; // e.g. "db.myapp.anvil", resolvable by every other member
}

message Intent {
  string id = 1;
  string name = 2;
  repeated IntentMember members = 3;
  IntentNetwork network = 4; // unset until the first member is launched
}

// IntentNetwork is the shared bridge network created for one intent.
message IntentNetwork {
  string engine_network_name = 1; // Docker/Podman network name
  string bridge_interface = 2;    // underlying Linux bridge interface name
  string subnet = 3;              // CIDR, e.g. "10.55.201.0/24"
  string gateway = 4;
  string docker_ip_range = 5; // CIDR sub-range reserved for the engine's own IPAM
  string dns_domain = 6;      // zone members are named in, e.g. "myapp.anvil"
  string dns_server = 7;      // address members send DNS queries to
}

message IntentListRequest {}

message IntentListReply {
  repeated Intent intents = 1;
}

message IntentInfoRequest {
  string name = 1;
}

message IntentInfoReply {
  Intent intent = 1;
}

// Remove ungroups member (by instance ID or role) without deleting the underlying instance.
message IntentRemoveRequest {
  string name = 1;
  string member = 2;
}

message IntentRemoveReply {
  Intent intent = 1;
}

message IntentDeleteRequest {
  string name = 1;
  bool purge_members = 2; // also delete every member instance, not just the group record
}

message IntentDeleteReply {
  Intent intent = 1;
}

message IntentApplyRequest {
  bytes manifest = 1;               // anvil.yaml content
  bool dry_run = 2;                 // only send the plan
  bool prune = 3;                   // delete members that are no longer in the manifest
  bool recreate = 4;                // allow replacing a VM, which loses its disk
  repeated string ssh_public_keys = 5; // authorized on every new VM, e.g. the caller's anvil key
  int32 wait_timeout_seconds = 6;   // readiness wait per depended-on member, defaults to 900
  map<string, string> vars = 7;     // values for ${VAR} in the manifest, over its own vars: block
}

// IntentApplyStep is one planned change to a member.
message IntentApplyStep {
  string role = 1;
  string instance_name = 2;
  string action = 3;           // "create" | "recreate" | "update" | "start" | "keep" | "delete"
  repeated string changes = 4; // why, one short line per difference
}

message IntentApplyPlan {
  string intent_name = 1;
  repeated IntentApplyStep steps = 2;
}

message IntentApplyProgress {
  oneof event {
    IntentApplyPlan plan = 1; // always the first event
    string status = 2;
    Intent intent = 3;        // final event on success, unset on a dry run
    string error = 4;
  }
}

// IntentMemberSpec is one member for AddMembers, named "<intent>-<role>" with default sizes.
message IntentMemberSpec {
  string role = 1;
  Kind kind = 2;    // KIND_VM or KIND_CONTAINER
  string image = 3; // VM catalog id / image ref, or container image ref
}

message IntentAddMembersRequest {
  string name = 1;
  bool create = 2; // the intent must not exist yet; false: it must already exist
  repeated IntentMemberSpec members = 3;
  VmHypervisor hypervisor = 4;         // for the VM members
  repeated string ssh_public_keys = 5; // authorized on every VM member
}

// IntentMemberProgress is one launch event of one member.
message IntentMemberProgress {
  string role = 1;
  LaunchProgress launch = 2; // status or instance, never error (see IntentAddMembersProgress.error)
}

message IntentAddMembersProgress {
  oneof event {
    IntentMemberProgress member = 1;
    Intent intent = 2; // final event on success
    string error = 3;  // final event on failure
  }
}

// HostService manages the known-hosts list migration targets are resolved
// against. Adding a host grants no trust by itself, it's just a saved shortcut.
service HostService {
  rpc Add(HostAddRequest) returns (HostAddReply);
  rpc List(HostListRequest) returns (HostListReply);
  rpc Remove(HostRemoveRequest) returns (HostRemoveReply);
  rpc Test(HostTestRequest) returns (HostTestReply); // checks real SSH reachability

  // Discover lists other anvil hosts announcing themselves on the local
  // network over mDNS. Nothing is saved and no trust is granted, it just
  // fills in what `anvil host add` would otherwise have to be told.
  rpc Discover(HostDiscoverRequest) returns (HostDiscoverReply);

  // ListHostDevices lists this host's USB and PCI devices that can be passed to a QEMU VM.
  rpc ListHostDevices(ListHostDevicesRequest) returns (ListHostDevicesReply);
}

message ListHostDevicesRequest {}

message ListHostDevicesReply {
  repeated HostDevice devices = 1;
}

// HostDevice is one USB or PCI device on the daemon's host.
message HostDevice {
  string id = 1;          // what --device takes, e.g. "usb:3-2.1" or "pci:0000:01:00.0"
  string bus = 2;         // "usb" | "pci"
  string vendor_id = 3;   // hex, e.g. "046d"
  string product_id = 4;  // hex
  string name = 5;        // from usb.ids/pci.ids when installed, else empty
  string driver = 6;      // host driver bound right now, empty if none
  int32 iommu_group = 7;  // PCI only, -1 without an IOMMU
  repeated string group_members = 8; // PCI only: other endpoints passed along with it

  // Exactly one of in_use_by and blocked_reason may be set; neither means free.
  string in_use_by = 9;       // name of the running instance holding it
  string blocked_reason = 10; // e.g. "holds the root filesystem"
}

message Host {
  string alias = 1;
  string target = 2;   // "user@host[:port]"
  string identity = 3; // optional path to a private key

  // Requires this host's SSH key to already be in anvil's own known_hosts file,
  // instead of trusting whatever key answers the first time.
  bool strict_host_key = 4;
}

message HostAddRequest {
  Host host = 1;
}

message HostAddReply {}

message HostListRequest {}

message HostListReply {
  repeated Host hosts = 1;
}

message HostRemoveRequest {
  string alias = 1;
}

message HostRemoveReply {}

message HostTestRequest {
  string alias = 1;
}

message HostTestReply {
  bool ok = 1;
  string message = 2; // human-readable detail either way
}

message HostDiscoverRequest {
  int32 timeout_seconds = 1; // 0 uses the daemon's own default
}

message DiscoveredHost {
  string name = 1;     // the remote host's own hostname
  string address = 2;  // address it answered from
  int32 ssh_port = 3;
}

message HostDiscoverReply {
  repeated DiscoveredHost hosts = 1;
}

// MigrateService moves a single instance or a whole intent to a different
// anvil host over SSH, with no daemon-to-daemon gRPC trust required.
service MigrateService {
  rpc Migrate(MigrateRequest) returns (stream MigrateProgress);

  // Key returns anvild's own public key for its outbound migration SSH connections.
  rpc Key(MigrateKeyRequest) returns (MigrateKeyReply);

  // GuestKey returns the target host's own default guest-access public key,
  // so it can be authorized in a VM before migrating it.
  rpc GuestKey(MigrateGuestKeyRequest) returns (MigrateGuestKeyReply);
}

message MigrateKeyRequest {}

message MigrateKeyReply {
  string public_key = 1;
}

message MigrateGuestKeyRequest {
  string to = 1; // same resolution as MigrateRequest.to
}

message MigrateGuestKeyReply {
  string public_key = 1;
}

message MigrateRequest {
  string name = 1; // resolved as a single instance first, a whole intent second
  string to = 2;   // a known host's alias, or a literal "user@host[:port]"

  // Default mode is destructive: copy, verify, then delete the source. copy skips the delete.
  bool copy = 3;

  string dest_name = 4; // single-instance migration only
  bool dry_run = 5;     // validate connectivity/preconditions, transfer nothing

  // Intent migration only: keep whatever members succeed instead of
  // rolling back the whole group on the first failure.
  bool best_effort = 6;
}

message MigrateProgress {
  oneof event {
    string status = 1;
    string error = 2;
    string done = 3; // single-instance migration: the new instance's ID on the target

    // Sent once per member, right after a whole-intent migration finishes.
    MigrateMemberResult member_done = 4;

    // The whole-intent migration's terminal event.
    IntentMigrateDone intent_done = 5;
  }
}

// MigrateMemberResult is one intent member's own migration outcome.
message MigrateMemberResult {
  string role = 1;
  string new_id = 2; // set when this member migrated successfully
  string error = 3;  // set when it didn't
}

// IntentMigrateDone is a whole-intent migration's final summary.
message IntentMigrateDone {
  string intent_name = 1;
  repeated MigrateMemberResult members = 2;
  bool rolled_back = 3; // true if an all-or-nothing migration hit a member failure and was undone
}

// ExportService packages a single instance or a whole intent into a portable tar.zst bundle, and relaunches one back from it.
// Unlike MigrateService, both ends run against this same anvild, so bundle_path/output_path are plain local filesystem paths.
service ExportService {
  rpc Export(ExportRequest) returns (stream ExportProgress);
  rpc Import(ImportRequest) returns (stream ImportProgress);
}

message ExportRequest {
  string name = 1;        // resolved as a single instance first, a whole intent second, unless is_intent
  string output_path = 2; // where to write the bundle, e.g. "/home/me/bundle.tar.zst"

  // is_intent skips instance resolution and looks name up as an intent only.
  // Lets a caller that already knows name is an intent (the TUI's Intents page) avoid being shadowed by an unrelated instance of the same name.
  bool is_intent = 3;
}

message ExportProgress {
  oneof event {
    string status = 1;
    string done = 2; // the bundle's final path
    string error = 3;
  }
}

message ImportRequest {
  string bundle_path = 1;
  string name = 2; // renames the imported intent, or the instance for a standalone bundle
}

message ImportMemberResult {
  string role = 1;
  string new_id = 2; // set when this member imported successfully
  string error = 3;  // set when it didn't
}

message ImportProgress {
  oneof event {
    string status = 1;
    string error = 2;
    ImportDone done = 3;
  }
}

// ImportDone is Import's final summary: intent_name is empty for a
// standalone instance bundle, and members has exactly one entry.
message ImportDone {
  string intent_name = 1;
  repeated ImportMemberResult members = 2;
}

// SnapshotService manages QCOW2 internal snapshots of a VM's disk, a point-in-time checkpoint that can be restored in place later. VM only.
// Create/Delete apply live over QMP; Restore stops the instance first and restarts it afterward if it was running.
service SnapshotService {
  rpc Create(SnapshotCreateRequest) returns (SnapshotCreateReply);
  rpc Restore(SnapshotRestoreRequest) returns (SnapshotRestoreReply);
  rpc Delete(SnapshotDeleteRequest) returns (SnapshotDeleteReply);
  rpc List(SnapshotListRequest) returns (SnapshotListReply);

  // SetSchedule sets (or, with every_seconds 0, removes) a VM's scheduled snapshots.
  rpc SetSchedule(SnapshotSetScheduleRequest) returns (SnapshotSetScheduleReply);
}

message SnapshotSetScheduleRequest {
  string name = 1;
  int64 every_seconds = 2; // 0 removes the schedule; at least 60 otherwise
  int32 keep = 3;          // at least 1
}

message SnapshotSetScheduleReply {}

message SnapshotCreateRequest {
  string name = 1; // instance name
  string snapshot_name = 2;
}

message SnapshotCreateReply {}

message SnapshotRestoreRequest {
  string name = 1;
  string snapshot_name = 2;
}

message SnapshotRestoreReply {}

message SnapshotDeleteRequest {
  string name = 1;
  string snapshot_name = 2;
}

message SnapshotDeleteReply {}

message SnapshotListRequest {
  string name = 1;
}

message SnapshotInfo {
  string name = 1;
  int64 created_at_unix = 2;

  // has_vm_state is true for a snapshot taken live (embeds VM state alongside the disk data), false for disk-only.
  // Informational only: restore always resets disk content regardless of this field.
  bool has_vm_state = 3;
}

message SnapshotListReply {
  repeated SnapshotInfo snapshots = 1;
}

message VersionRequest {}

message VersionReply {
  string version = 1; // module version from git, e.g. "v1.1.1", "+dirty" for a modified tree
  string commit = 2;  // short VCS revision, empty when built outside git
}

// EphemeralService runs commands in throwaway clones restored from warm snapshots
// (Firecracker with its jailer only). See docs/ephemeral.md.
service EphemeralService {
  // Run restores one clone per distro, runs the command in each, streams their output,
  // then deletes them. The first input is the request; an upload and stdin follow.
  rpc Run(stream RunInput) returns (stream RunEvent);

  // WarmCreate builds (or finds) the warm snapshot a run with these parameters uses.
  rpc WarmCreate(WarmCreateRequest) returns (stream WarmCreateProgress);
  rpc WarmList(WarmListRequest) returns (WarmListReply);
  rpc WarmDelete(WarmDeleteRequest) returns (WarmDeleteReply);
  // WarmSave turns a running or kept clone into a warm snapshot of its own.
  rpc WarmSave(WarmSaveRequest) returns (WarmSaveReply);
  // WarmPoolSet keeps a number of clones of a warm snapshot restored ahead of time, so a
  // run takes one instead of restoring; size 0 removes the pool.
  rpc WarmPoolSet(WarmPoolSetRequest) returns (WarmPoolSetReply);
  rpc WarmPoolList(WarmPoolListRequest) returns (WarmPoolListReply);

  // CloneList lists running clones and the ones kept by keep_failed.
  rpc CloneList(CloneListRequest) returns (CloneListReply);
  // CloneExec runs a command in a clone, a shell with tty for `anvil ephemeral shell`.
  rpc CloneExec(stream CloneExecInput) returns (stream CloneExecOutput);
  rpc CloneDelete(CloneDeleteRequest) returns (CloneDeleteReply);

  // RunApp runs a GUI app in a throwaway clone of a warm snapshot that has its package
  // installed, and shows its windows through the client's waypipe. The first input is the
  // request; display_ready follows once the client's waypipe listens in the session's dir.
  rpc RunApp(stream AppInput) returns (stream AppEvent);
}

message TerminalSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message RunRequest {
  repeated string distros = 1;  // one clone each, all in parallel
  repeated string command = 2;
  repeated string env = 3;      // KEY=value
  int32 cpus = 4;               // 0 for the default; part of the warm snapshot's key
  int64 memory_mib = 5;         // 0 for the default; part of the warm snapshot's key
  bool keep_failed = 6;         // keep clones whose command failed, for `anvil ephemeral shell`
  bool upload = 7;              // a tar stream follows in upload_chunk, extracted into /work
  bool tty = 8;                 // one distro only: run on a terminal, with stdin
  TerminalSize size = 9;
  string cwd = 10;              // /work with an upload, / otherwise
  string arch = 11;
  // Guest paths or globs (** included) sent back after the command, failed or not, as
  // RunCollect events. Relative ones are relative to cwd.
  repeated string collect = 12;
  WarmSetup setup = 13;         // run once in the warm build, see WarmSetup
}

// WarmSetup is a script run in a warm build, on top of the distro's plain snapshot. The
// snapshot's key covers the script and the files, so changing either builds a new one.
message WarmSetup {
  string name = 1;                // shown in listings, the script's file name
  bytes script = 2;               // a shebang picks the interpreter, sh otherwise
  repeated SetupFile files = 3;   // put in /work for the script, removed after it
}

message SetupFile {
  string name = 1; // relative, slash separated
  bytes data = 2;
}

message RunInput {
  oneof input {
    RunRequest request = 1;
    bytes upload_chunk = 2;
    bool upload_done = 3;
    bytes stdin = 4;
    bool stdin_close = 5;
    TerminalSize resize = 6;
  }
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

message RunProgress {
  string clone_id = 1;  // empty before the clone exists
  string distro = 2;
  string message = 3;
}

message RunOutput {
  string clone_id = 1;
  string distro = 2;
  OutputStream stream = 3;
  bytes data = 4;
}

message RunExit {
  string clone_id = 1;
  string distro = 2;
  int32 exit_code = 3;   // -1 when the command never ran, see error
  int64 duration_ms = 4; // the command's run time, from restore to exit
  bool kept = 5;
  string error = 6;      // why the clone failed before or around the command
}

// RunCollect carries the tar of one collect path from one clone, in chunks, before its
// RunExit. Entries are relative to the path's parent, or to the directory before a glob.
message RunCollect {
  string clone_id = 1;
  string distro = 2;
  int32 index = 3;     // which of RunRequest.collect
  bytes data = 4;      // the next chunk of the tar stream
  bool done = 5;       // the last message for this index
  string warning = 6;  // with done: nothing matched, or the tar failed
}

message RunEvent {
  oneof event {
    RunProgress progress = 1;
    RunOutput output = 2;
    RunExit exit = 3;
    RunCollect collect = 4;
  }
}

message WarmSnapshot {
  string key = 1;
  string distro = 2;
  string arch = 3;
  int32 cpus = 4;
  int64 memory_mib = 5;
  int64 disk_gib = 6;
  string firecracker_version = 7;
  int64 size_bytes = 8;
  int64 created_at_unix = 9;
  int64 last_used_at_unix = 10;
  string app = 11;   // the package installed for `anvil gui --ephemeral`, empty for none
  bool x11 = 12;     // with app: Xwayland is installed too
  int32 pool_size = 13;  // clones its pool keeps ready, 0 without a pool
  int32 pool_ready = 14; // clones ready now
  string base = 15;      // with a setup script or saved: the snapshot it builds on
  string setup = 16;     // the setup script's name, or "saved from <clone>"
  bool saved = 17;       // saved from a clone, never built again
}

message WarmCreateRequest {
  string distro = 1;
  string arch = 2;
  int32 cpus = 3;
  int64 memory_mib = 4;
  bool rebuild = 5; // build it again even when it exists
  WarmSetup setup = 6;
}

message WarmCreateProgress {
  string status = 1;
  WarmSnapshot snapshot = 2; // set on the last message
}

message WarmListRequest {}

message WarmListReply {
  repeated WarmSnapshot snapshots = 1;
}

message WarmDeleteRequest {
  repeated string keys = 1; // a key or a unique prefix of one
  bool all = 2;
}

message WarmDeleteReply {
  repeated string deleted = 1;
}

message WarmSaveRequest {
  string clone_id = 1; // or a unique prefix
}

message WarmSaveReply {
  WarmSnapshot snapshot = 1;
}

// WarmPool is a pool of clones restored ahead of time. It is named by distro, arch and
// size, not by warm key, so it carries over to the new snapshot after an upgrade.
message WarmPool {
  string distro = 1;
  string arch = 2;
  int32 cpus = 3;
  int64 memory_mib = 4;
  int32 size = 5;
  int32 ready = 6;      // clones ready now
  string warm_key = 7;  // the snapshot its clones come from, empty until the first fill
  string error = 8;     // why the last refill failed, empty when it didn't
}

message WarmPoolSetRequest {
  string distro = 1;  // or "@<key>" for one warm snapshot, a setup or saved one
  string arch = 2;
  int32 cpus = 3;
  int64 memory_mib = 4;
  int32 size = 5; // 0 removes the pool
}

message WarmPoolSetReply {
  WarmPool pool = 1;
}

message WarmPoolListRequest {}

message WarmPoolListReply {
  repeated WarmPool pools = 1;
}

message EphemeralClone {
  string id = 1;
  string distro = 2;
  string warm_key = 3;
  int64 started_at_unix = 4;
  bool exited = 5;     // the run's command is done; the clone itself still runs
  int32 exit_code = 6;
  bool kept = 7;
}

message CloneListRequest {}

message CloneListReply {
  repeated EphemeralClone clones = 1;
}

message CloneExecRequest {
  string clone_id = 1;  // or a unique prefix
  repeated string command = 2;
  repeated string env = 3;
  bool tty = 4;
  TerminalSize size = 5;
}

message CloneExecInput {
  oneof input {
    CloneExecRequest request = 1;
    bytes stdin = 2;
    bool stdin_close = 3;
    TerminalSize resize = 4;
  }
}

message CloneExecOutput {
  oneof output {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3; // the last message
  }
}

message CloneDeleteRequest {
  repeated string ids = 1; // ids or unique prefixes
  bool all = 2;
}

message CloneDeleteReply {
  repeated string deleted = 1;
}

message AppRequest {
  string distro = 1;
  string package = 2;           // installed in the warm snapshot when the image lacks it
  repeated string command = 3;  // empty: the Exec of the package's desktop entry
  bool x11 = 4;                 // also X11 apps, through xwayland-satellite
  int32 cpus = 5;
  int64 memory_mib = 6;         // 0 for 2048
  string arch = 7;
  repeated string env = 8;      // KEY=value
  bool info_only = 9;           // build the warm snapshot and report the app, without running it
}

message AppInput {
  oneof input {
    AppRequest request = 1;
    bool display_ready = 2;
  }
}

// AppSession is where the client runs `waypipe -s <display_dir>/waypipe.sock client`.
message AppSession {
  string display_dir = 1;
}

// AppStarted is the app a run starts, or the one an info_only run found.
message AppStarted {
  string clone_id = 1;
  string distro = 2;
  repeated string command = 3;
  GUIAppInfoReply info = 4;
}

message AppEvent {
  oneof event {
    RunProgress progress = 1;
    RunOutput output = 2;
    RunExit exit = 3;      // the last event
    AppSession session = 4;
    AppStarted app = 5;
  }
}

// RunnerService takes jobs from Forgejo/Gitea (15+) or GitHub Actions and runs each in
// its own ephemeral clone, with the forge's runner inside it for that one job.
service RunnerService {
  rpc Add(RunnerAddRequest) returns (RunnerAddReply);
  rpc List(RunnerListRequest) returns (RunnerListReply);
  rpc Remove(RunnerRemoveRequest) returns (RunnerRemoveReply);
  // SetPaused stops or resumes taking new jobs; running jobs go on.
  rpc SetPaused(RunnerSetPausedRequest) returns (RunnerSetPausedReply);
  // Jobs lists running and recent jobs, newest first.
  rpc Jobs(RunnerJobsRequest) returns (RunnerJobsReply);
}

message Runner {
  string name = 1;
  string forge = 2;               // "forgejo" or "github"
  string url = 3;
  string scope = 4;               // repos/<owner>/<repo>, orgs/<org> or admin (forgejo)
  map<string, string> labels = 5; // job label -> distro or "@<warm key>"
  int32 cpus = 6;
  int64 memory_mib = 7;
  int32 max_jobs = 8;
  string version = 9;             // runner release installed in clones, empty for the latest
  bool paused = 10;
  int32 running = 11;             // jobs running now
  int64 last_poll_unix = 12;
  string last_error = 13;         // of the last poll, empty when it worked
  int64 created_at_unix = 14;
}

message RunnerAddRequest {
  Runner runner = 1;
  string token = 2; // forge API token, kept by anvild and never sent back
}

message RunnerAddReply {
  Runner runner = 1;
}

message RunnerListRequest {}

message RunnerListReply {
  repeated Runner runners = 1;
}

message RunnerRemoveRequest {
  string name = 1;
}

message RunnerRemoveReply {}

message RunnerSetPausedRequest {
  string name = 1;
  bool paused = 2;
}

message RunnerSetPausedReply {
  Runner runner = 1;
}

message RunnerJobsRequest {
  string runner = 1; // empty for every runner
}

message RunnerJob {
  string id = 1;
  string runner = 2;
  int64 job_id = 3;      // the forge's job id
  string name = 4;
  repeated string labels = 5;
  string distro = 6;
  string clone_id = 7;
  string state = 8;      // running, succeeded, failed
  int32 exit_code = 9;
  string error = 10;
  int64 started_at_unix = 11;
  int64 ended_at_unix = 12;
}

message RunnerJobsReply {
  repeated RunnerJob jobs = 1;
}

// PipelineService runs anvil-ci.yaml pipelines: jobs on ephemeral clones, ordered by
// their needs, by hand or on every new commit of a watched branch.
service PipelineService {
  // Run uploads a source tree and runs its pipeline, streaming it to the end. The first
  // input is the request, upload chunks follow. A dropped stream cancels the run.
  rpc Run(stream PipelineRunInput) returns (stream PipelineEvent);
  // Rerun runs an earlier run's source again, streaming the new run.
  rpc Rerun(PipelineRerunRequest) returns (stream PipelineEvent);
  rpc Cancel(PipelineCancelRequest) returns (PipelineCancelReply);
  rpc ListRuns(PipelineListRunsRequest) returns (PipelineListRunsReply);
  rpc GetRun(PipelineGetRunRequest) returns (PipelineRun);
  // Logs streams a job's output on one distro, or every log of the run.
  rpc Logs(PipelineLogsRequest) returns (stream PipelineChunk);
  // Artifacts streams the run's collected files as a tar, <job>/<distro>/...
  rpc Artifacts(PipelineArtifactsRequest) returns (stream PipelineChunk);

  rpc AddWatch(PipelineWatchAddRequest) returns (PipelineWatch);
  rpc ListWatches(PipelineWatchListRequest) returns (PipelineWatchListReply);
  rpc RemoveWatch(PipelineWatchRemoveRequest) returns (PipelineWatchRemoveReply);
  rpc SetWatchPaused(PipelineWatchPauseRequest) returns (PipelineWatch);
  // TriggerWatch runs a watch's pipeline on its branch now, in the background.
  rpc TriggerWatch(PipelineWatchTriggerRequest) returns (PipelineWatchTriggerReply);
}

message PipelineRunRequest {
  string file = 1; // the pipeline file in the source, anvil-ci.yaml when empty
}

message PipelineRunInput {
  oneof input {
    PipelineRunRequest request = 1;
    bytes upload_chunk = 2; // a tar of the source tree
    bool upload_done = 3;
  }
}

message PipelineJob {
  string name = 1;
  string distro = 2;
  string state = 3; // pending, running, succeeded, failed, skipped
  int32 exit_code = 4;
  string error = 5;
  int64 duration_ms = 6;
}

message PipelineRun {
  string id = 1;
  string source = 2;  // manual, rerun:<id> or watch:<name>
  string file = 3;
  string commit = 4;
  string state = 5;   // running, succeeded, failed, cancelled
  string error = 6;
  string applied = 7; // with apply: "applied <file>" or "failed: <why>"
  repeated PipelineJob jobs = 8;
  int64 started_at_unix = 9;
  int64 ended_at_unix = 10;
}

message PipelineProgress {
  string job = 1;    // empty for the run itself
  string distro = 2;
  string message = 3;
}

message PipelineOutput {
  string job = 1;
  string distro = 2;
  OutputStream stream = 3;
  bytes data = 4;
}

message PipelineEvent {
  oneof event {
    PipelineRun run = 1;  // first when the run starts, last when it ends
    PipelineProgress progress = 2;
    PipelineOutput output = 3;
    PipelineJob job = 4;  // a job on one distro changed state
  }
}

message PipelineRerunRequest {
  string id = 1; // or a unique start of one
}

message PipelineCancelRequest {
  string id = 1;
}

message PipelineCancelReply {}

message PipelineListRunsRequest {
  int32 limit = 1; // 0 for all
}

message PipelineListRunsReply {
  repeated PipelineRun runs = 1;
}

message PipelineGetRunRequest {
  string id = 1;
}

message PipelineLogsRequest {
  string id = 1;
  string job = 2;    // empty for every log
  string distro = 3; // empty for every distro of job
}

message PipelineChunk {
  bytes data = 1;
}

message PipelineArtifactsRequest {
  string id = 1;
}

message PipelineWatch {
  string name = 1;
  string repo = 2;
  string branch = 3;
  string file = 4;
  int64 interval_seconds = 5;
  bool paused = 6;
  string last_commit = 7;
  string last_run = 8;
  string last_error = 9;
  int64 last_poll_unix = 10;
}

message PipelineWatchAddRequest {
  PipelineWatch watch = 1;
}

message PipelineWatchListRequest {}

message PipelineWatchListReply {
  repeated PipelineWatch watches = 1;
}

message PipelineWatchRemoveRequest {
  string name = 1;
}

message PipelineWatchRemoveReply {}

message PipelineWatchPauseRequest {
  string name = 1;
  bool paused = 2;
}

message PipelineWatchTriggerRequest {
  string name = 1;
}

message PipelineWatchTriggerReply {}
