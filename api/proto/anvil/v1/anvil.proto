syntax = "proto3";

package anvil.v1;

option go_package = "github.com/anvil-project/anvil/api/gen/anvil/v1;anvilv1";

// InstanceService manages the lifecycle of VM and container instances.
// This is the M1 slice: VM-only fields are populated today, container
// fields exist so the wire schema doesn't need a breaking change in M3.
service InstanceService {
  rpc Launch(LaunchRequest) returns (stream LaunchProgress);
  rpc List(ListRequest) returns (ListReply);
  rpc Info(InfoRequest) returns (InfoReply);
  rpc Start(StartRequest) returns (StartReply);
  rpc Stop(StopRequest) returns (StopReply);
  rpc Delete(DeleteRequest) returns (DeleteReply);
  rpc Purge(PurgeRequest) returns (PurgeReply);
  rpc Logs(LogsRequest) returns (stream LogChunk);
  rpc Mount(MountRequest) returns (MountReply);
  rpc Umount(UmountRequest) returns (UmountReply);
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_VM = 1;
  KIND_CONTAINER = 2;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_STOPPED = 1;
  STATE_STARTING = 2;
  STATE_RUNNING = 3;
  STATE_STOPPING = 4;
  STATE_DELETING = 5;
  STATE_DELETED = 6;
  STATE_ERROR = 7;
}

message VMSpec {
  string image_ref = 1;
  string arch = 2;
  int32 cpus = 3;
  int64 memory_mib = 4;
  int64 disk_gib = 5;
  string cloud_init_user_data = 6;
  string cloud_init_name = 7; // reference into the saved cloud-init library; mutually exclusive with inline data
  string network_mode = 8;    // "slirp" | "bridge"
  repeated string ssh_public_keys = 9;

  // ssh_port is daemon-populated, not client input: a read-only output the
  // client uses for `anvil shell`/`exec`/`transfer` to reach a running
  // instance, set by internal/vm.Backend.Start (a freshly allocated SLIRP
  // host-forward port — it can change across a stop/start cycle, don't
  // cache it client-side).
  //
  // default_user is normally daemon-populated too (from the image
  // catalog, by internal/vm.Backend.Create) and any client-supplied value
  // is overwritten in that case — except when source_disk_path is set
  // (see below), where there's no catalog entry to read a default user
  // from at all, so `anvil migrate`'s own re-launch on the target host is
  // the one legitimate case that actually sets this as real input.
  int32 ssh_port = 10;
  string default_user = 11;

  // Host directories shared into the guest via 9p (see anvil.v1.Mount).
  // Managed by `anvil mount`/`anvil umount`, not settable at launch time.
  repeated Mount mounts = 12;

  // Daemon-populated, not client input: set by internal/intent.Manager
  // before a launch that joins an intent (network_mode becomes "bridge"
  // in that case), consumed by internal/vm.Backend to attach a tap device
  // instead of using SLIRP, and by cloud-init's generated network-config.
  // Meaningless when network_mode isn't "bridge".
  string bridge_interface = 13; // Linux interface name of the intent's shared bridge
  string static_ip = 14;        // CIDR, e.g. "10.55.201.4/24"
  string gateway = 15;

  // Ports to publish from the host into the guest, same idea (and same
  // message type) as ContainerSpec.ports below — e.g. a plain nginx
  // install running directly inside a cloud-init VM, reachable the same
  // way `--publish` already works for containers. Only meaningful in
  // SLIRP mode (network_mode unset/"slirp"): a bridged intent member
  // already has its own directly-reachable address, there's nothing to
  // forward.
  repeated PortMapping ports = 16;

  // Daemon-populated, not client input: set by internal/intent.Manager for
  // an intent member. A VM has no DNS resolution mechanism of its own
  // (unlike a container, which gets Docker's embedded DNS for free) — this
  // is every other already-known intent member's role -> static IP at the
  // time this VM was launched, injected into /etc/hosts via cloud-init
  // (see internal/vm.Backend's buildSeed/mergeExtraHosts). A member added
  // to the intent later isn't retroactively added here; this VM would
  // need a restart to pick it up. Meaningless outside an intent.
  map<string, string> extra_hosts = 17;

  // source_disk_path is client input, but only meaningful for `anvil
  // migrate`'s own internal re-launch of a migrated instance on the
  // target host (see MigrateService below): when set, Create adopts this
  // already-prepared disk as the instance's own disk.qcow2 directly,
  // skipping catalog resolution and overlay creation entirely, and skips
  // generating a cloud-init seed too — the disk already has everything
  // from its original first boot baked in (users, SSH keys, packages),
  // and re-running cloud-init against a new instance-id risks re-applying
  // modules that aren't all idempotent. Not meant to be set by a normal
  // `anvil launch`.
  string source_disk_path = 18;
}

// Mount is one host directory shared into a VM's guest over 9p. Added and
// removed one at a time via InstanceService.Mount/Umount (see those RPCs
// below) — there's no `--mount` flag on Launch, this is deliberately a
// post-creation operation.
message Mount {
  string host_path = 1;
  string guest_path = 2;
  string tag = 3; // internal 9p mount_tag, assigned automatically, not user-facing
  bool read_only = 4;
}

enum ContainerEngine {
  CONTAINER_ENGINE_UNSPECIFIED = 0;
  CONTAINER_ENGINE_DOCKER = 1;
  CONTAINER_ENGINE_PODMAN = 2;
}

message ContainerSpec {
  string image_ref = 1;
  map<string, string> env = 2;
  repeated string entrypoint = 3;
  repeated string cmd = 4;
  repeated VolumeMount volumes = 5;
  repeated PortMapping ports = 6;
  string network_mode = 7;
  ContainerEngine engine = 8;

  // Daemon-populated, not client input: the engine's own container ID,
  // set by the backend's Create. Every call after Create (start/stop/
  // inspect/logs) is by this ID, not by anvil's own instance ID.
  string container_id = 9;

  // Daemon-populated, not client input: set by internal/intent.Manager for
  // an intent member, same idea as VMSpec's bridge fields. network_alias
  // is this container's own resolvable name on the intent's network (its
  // role) — Docker's embedded DNS resolves it automatically for other
  // container peers, no extra_hosts entry needed for those. extra_hosts
  // covers what Docker's DNS can't: other intent members that are VMs
  // (not Docker-managed, invisible to Docker's own DNS), keyed by role,
  // valued by their static IP — becomes a `--add-host`-equivalent
  // (HostConfig.ExtraHosts) at container-create time. Meaningless outside
  // an intent.
  string network_alias = 10;
  map<string, string> extra_hosts = 11;
}

message VolumeMount {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;
}

message PortMapping {
  int32 host_port = 1;
  int32 guest_port = 2;
  string protocol = 3; // "tcp" | "udp"
}

message Instance {
  string id = 1;
  string name = 2;
  Kind kind = 3;
  State state = 4;
  int64 created_at_unix = 5;
  map<string, string> labels = 6;
  VMSpec vm = 7;
  ContainerSpec container = 8;
}

message LaunchRequest {
  string name = 1;
  Kind kind = 2;
  VMSpec vm = 3;
  ContainerSpec container = 4;

  // Both optional. When intent_name is set, this launch joins that intent
  // as a member (creating the intent first if it doesn't exist yet)
  // instead of just producing a standalone instance — see IntentService
  // below. role labels the member (defaults to the instance's own name if
  // left blank) and has no effect unless intent_name is also set.
  string intent_name = 5;
  string role = 6;

  bool no_start = 7;

  // Internal only, not meant to be set by a normal `anvil launch` — used
  // by `anvil migrate-import` relaunching one member of a migrated
  // intent, to pin the target's newly-created intent to the exact
  // subnet/gateway/docker-IP-range — and, for a VM, the exact static
  // address — the source intent already had, instead of letting
  // IntentService auto-allocate a fresh one (see
  // internal/migrate.Manager.migrateIntent's doc comment for why: a
  // migrated VM's disk skips cloud-init entirely on relaunch, so its
  // already-baked-in static network config, and whatever peer
  // /etc/hosts entries it already has, have no chance to catch up to a
  // brand new subnet on their own). Ignored unless intent_name is also
  // set; pinned_static_ip is VM-only.
  string pinned_subnet = 8;
  string pinned_gateway = 9;
  string pinned_docker_ip_range = 10;
  string pinned_static_ip = 11;
}

message LaunchProgress {
  oneof event {
    string status = 1;   // human-readable phase, e.g. "downloading image", "booting"
    int32 percent = 2;   // 0-100 for the current phase, when known
    Instance instance = 3; // final event on success
    string error = 4;
  }
}

message ListRequest {
  Kind kind_filter = 1; // KIND_UNSPECIFIED means "all"
}

message ListReply {
  repeated Instance instances = 1;
}

message InfoRequest {
  repeated string names = 1;
}

message InfoReply {
  repeated Instance instances = 1;
}

message StartRequest {
  repeated string names = 1;
}

message StartReply {}

message StopRequest {
  repeated string names = 1;
  bool force = 2;
  int64 timeout_seconds = 3;
}

message StopReply {}

message DeleteRequest {
  repeated string names = 1;
  bool purge = 2;
}

message DeleteReply {}

message PurgeRequest {
  repeated string names = 1; // empty means purge everything pending
}

message PurgeReply {}

message LogsRequest {
  string name = 1;
  bool follow = 2;      // keep streaming as new output arrives, like `tail -f`
  int32 tail_lines = 3; // 0 means "from the beginning"
}

// For a VM this is boot/console output (what cloud-init prints while it
// runs), not application logs from inside the guest — see the plan's "VM
// vs container" CLI notes. Once M3 lands, a container's Logs instead
// streams its actual stdout/stderr.
message LogChunk {
  bytes data = 1;
}

// CloudInitService manages the saved cloud-init user-data library (M2).
// A VM's LaunchRequest can reference a saved config by name
// (VMSpec.cloud_init_name) instead of shipping the content inline.
service CloudInitService {
  rpc List(CloudInitListRequest) returns (CloudInitListReply);
  rpc Get(CloudInitGetRequest) returns (CloudInitGetReply);
  rpc Save(CloudInitSaveRequest) returns (CloudInitSaveReply); // creates or updates
  rpc Rename(CloudInitRenameRequest) returns (CloudInitRenameReply);
  rpc Delete(CloudInitDeleteRequest) returns (CloudInitDeleteReply);

  // ImportRepo fetches a template-repo manifest (see docs/mirrors.md's
  // "cloud-init template repos" section for the manifest shape and how
  // to host one) and saves each listed template into the same saved
  // library `anvil cloud-init *` already manages — same idea as a VM
  // mirror's manifest, just for cloud-init templates instead of distro
  // images, and fetched here (daemon-side) for the same reason: one
  // implementation instead of a second copy in the CLI and another in
  // the TUI.
  rpc ImportRepo(CloudInitImportRepoRequest) returns (stream CloudInitImportRepoProgress);
}

message CloudInitConfigInfo {
  string name = 1;
  int64 modified_at_unix = 2;
}

message CloudInitListRequest {}

message CloudInitListReply {
  repeated CloudInitConfigInfo configs = 1;
}

message CloudInitGetRequest {
  string name = 1;
}

message CloudInitGetReply {
  string name = 1;
  string content = 2;
  int64 modified_at_unix = 3;
}

message CloudInitSaveRequest {
  string name = 1;
  string content = 2;
}

message CloudInitSaveReply {}

message CloudInitRenameRequest {
  string old_name = 1;
  string new_name = 2;
}

message CloudInitRenameReply {}

message CloudInitDeleteRequest {
  string name = 1;
}

message CloudInitDeleteReply {}

message CloudInitImportRepoRequest {
  string manifest_url = 1;
  bool force = 2; // overwrite a name already in the library; default skips it, doesn't error
}

message CloudInitImportRepoProgress {
  oneof event {
    string status = 1;                       // human-readable phase, e.g. "fetching nginx"
    CloudInitImportResult imported = 2;       // one template's own result, as it finishes
    string error = 3;                         // a fetch/parse failure for the manifest itself; ends the stream
  }
}

// CloudInitImportResult is one template's own outcome within a whole
// ImportRepo call — a failure fetching or saving *this* template doesn't
// stop the rest of the repo from importing.
message CloudInitImportResult {
  string name = 1;
  bool skipped = 2; // true: already existed in the library and force wasn't set
  string error = 3; // set if fetching/saving this one specific template failed
}

// MirrorService manages runtime-added image mirrors (M2 for VM manifest
// mirrors, M3 for container registry mirrors). The built-in catalog
// (data/distros/distribution-info.json) always applies; mirrors add to or
// override it by priority.
service MirrorService {
  rpc Add(MirrorAddRequest) returns (MirrorAddReply);
  rpc List(MirrorListRequest) returns (MirrorListReply);
  rpc Remove(MirrorRemoveRequest) returns (MirrorRemoveReply);
  rpc SetEnabled(MirrorSetEnabledRequest) returns (MirrorSetEnabledReply);
}

enum MirrorKind {
  MIRROR_KIND_UNSPECIFIED = 0;
  MIRROR_KIND_VM = 1;
  MIRROR_KIND_CONTAINER = 2;
}

message Mirror {
  string name = 1;
  MirrorKind kind = 2;
  string manifest_url = 3; // VM mirrors: a distribution-info.json-shaped manifest
  string registry = 4;     // container mirrors: host[:port]
  string mirror_of = 5;    // container mirrors: upstream registry this mirrors, optional
  bool insecure = 6;       // container mirrors: skip TLS verification
  int32 priority = 7;      // higher wins on a name/version/arch collision
  bool enabled = 8;
}

message MirrorAddRequest {
  Mirror mirror = 1;
}

message MirrorAddReply {}

message MirrorListRequest {
  MirrorKind kind_filter = 1; // MIRROR_KIND_UNSPECIFIED means "all"
}

message MirrorListReply {
  repeated Mirror mirrors = 1;
}

message MirrorRemoveRequest {
  string name = 1;
}

message MirrorRemoveReply {}

message MirrorSetEnabledRequest {
  string name = 1;
  bool enabled = 2;
}

message MirrorSetEnabledReply {}

// ImageService manages the on-disk cache of downloaded VM base images
// (internal/vm/image.Vault's "prepared" tier) — this is about the shared
// base images instances are cloned from, not a per-instance disk. There's
// no container-image equivalent here: once M3 lands, container images are
// Docker's/Podman's own cache to manage, anvil doesn't duplicate that.
service ImageService {
  rpc List(ImageListRequest) returns (ImageListReply);
  rpc Delete(ImageDeleteRequest) returns (ImageDeleteReply);

  // Catalog lists the source distro images `anvil launch --kind vm
  // <id>` resolves against — the built-in multi-distro catalog merged
  // with every enabled VM mirror (internal/vm.Backend.EffectiveCatalog),
  // the same merge a real launch uses, not a separate listing. This is
  // the catalog of what *can* be downloaded and launched; ImageService's
  // List above is the different, already-downloaded cache tier.
  rpc Catalog(CatalogRequest) returns (CatalogReply);
}

message CachedImage {
  string id = 1;
  string arch = 2;
  string path = 3;
  int64 size_bytes = 4;
  int32 ref_count = 5; // number of current instances whose disk is backed by this image
}

message ImageListRequest {}

message ImageListReply {
  repeated CachedImage images = 1;
}

// CatalogEntry is one fetchable distro image (internal/vm/image.DistroEntry).
message CatalogEntry {
  string id = 1;      // e.g. "ubuntu-24.04" — what `anvil launch --kind vm <id>` takes
  string name = 2;    // e.g. "Ubuntu 24.04 LTS"
  string distro = 3;
  string version = 4;
  string arch = 5;
  int64 min_disk_gib = 6;
  string default_user = 7;
}

message CatalogRequest {}

message CatalogReply {
  repeated CatalogEntry entries = 1;
}

message ImageDeleteRequest {
  string id = 1;
  string arch = 2;   // optional; only needed if id is ambiguous across architectures
  bool force = 3;    // delete even if ref_count > 0 — will break those instances' disks
}

message ImageDeleteReply {}

message MountRequest {
  string name = 1;
  string host_path = 2;
  string guest_path = 3;
  bool read_only = 4;
}

message MountReply {}

message UmountRequest {
  string name = 1;
  string guest_path = 2;
}

message UmountReply {}

// IntentService manages named groups of VM/container instances (M4).
// There's no Create/Add RPC here on purpose: a member is created exactly
// the same way a standalone instance is, through
// InstanceService.Launch(intent_name, role) — see LaunchRequest above.
// This service is just for reading and managing the group afterward. The
// shared per-intent network described in the plan isn't implemented yet;
// right now an intent is membership bookkeeping only.
service IntentService {
  rpc List(IntentListRequest) returns (IntentListReply);
  rpc Info(IntentInfoRequest) returns (IntentInfoReply);
  rpc Remove(IntentRemoveRequest) returns (IntentRemoveReply);
  rpc Delete(IntentDeleteRequest) returns (IntentDeleteReply);
}

message IntentMember {
  string instance_id = 1;
  string role = 2;
  Kind kind = 3;
}

message Intent {
  string id = 1;
  string name = 2;
  repeated IntentMember members = 3;
  IntentNetwork network = 4; // unset until the first member is launched
}

// IntentNetwork is the shared bridge network created for one intent (see
// PLAN.md's Intents section) — daemon-populated, not client input.
message IntentNetwork {
  string engine_network_name = 1; // Docker/Podman network name
  string bridge_interface = 2;    // underlying Linux bridge interface name
  string subnet = 3;              // CIDR, e.g. "10.55.201.0/24"
  string gateway = 4;
  string docker_ip_range = 5; // CIDR sub-range reserved for the engine's own IPAM
}

message IntentListRequest {}

message IntentListReply {
  repeated Intent intents = 1;
}

message IntentInfoRequest {
  string name = 1;
}

message IntentInfoReply {
  Intent intent = 1;
}

// Remove ungroups member (matched by instance ID or role) from the
// intent without deleting the underlying instance — for that, delete the
// instance normally via InstanceService.Delete.
message IntentRemoveRequest {
  string name = 1;
  string member = 2;
}

message IntentRemoveReply {
  Intent intent = 1;
}

message IntentDeleteRequest {
  string name = 1;
  bool purge_members = 2; // also delete every member instance, not just the group record
}

message IntentDeleteReply {
  Intent intent = 1;
}

// HostService manages the known-hosts list migration targets are resolved
// against (M5) — see MigrateService below. A host here is nothing more
// than an SSH destination anvil already trusts you to have real access
// to; adding one grants no trust by itself, it's just a saved shortcut so
// `anvil migrate --to <alias>` doesn't need a literal user@host every
// time. mDNS auto-discovery of peer anvil hosts (from the original plan)
// is deferred, not built — this is the manual "known hosts" half only.
service HostService {
  rpc Add(HostAddRequest) returns (HostAddReply);
  rpc List(HostListRequest) returns (HostListReply);
  rpc Remove(HostRemoveRequest) returns (HostRemoveReply);
  // Test checks that alias is actually reachable over SSH and that
  // `anvil`/`anvild` are installed there — a real connectivity/sanity
  // check, not just "is this alias saved."
  rpc Test(HostTestRequest) returns (HostTestReply);
}

message Host {
  string alias = 1;
  string target = 2;   // "user@host[:port]"
  string identity = 3; // optional path to a private key; empty uses ssh's own default identity resolution
}

message HostAddRequest {
  Host host = 1;
}

message HostAddReply {}

message HostListRequest {}

message HostListReply {
  repeated Host hosts = 1;
}

message HostRemoveRequest {
  string alias = 1;
}

message HostRemoveReply {}

message HostTestRequest {
  string alias = 1;
}

message HostTestReply {
  bool ok = 1;
  string message = 2; // human-readable detail either way, e.g. the remote anvil version, or the SSH error
}

// MigrateService moves a single instance (M5) or a whole intent as one
// group (M7) to a different anvil host. Per the plan: no daemon-to-daemon
// gRPC trust — the source daemon SSHes into the target host and drives
// the target's own local `anvil` CLI (specifically `anvil migrate-import`,
// a plumbing-only command not meant to be run by hand), which talks to
// the target's own local anvild over its own unix socket. Whatever SSH
// access already exists to the target is the only trust this needs.
service MigrateService {
  rpc Migrate(MigrateRequest) returns (stream MigrateProgress);

  // Key returns anvild's own public key for its outbound migration SSH
  // connections (see internal/migrate.Manager.EnsurePublicKey), generating
  // a fresh passwordless keypair first if one doesn't exist yet. Copy the
  // returned key into a target host's ~/.ssh/authorized_keys before
  // migrating to it — `anvil host add` alone grants no trust by itself.
  rpc Key(MigrateKeyRequest) returns (MigrateKeyReply);

  // GuestKey asks the host named by `to` (over the same SSH channel
  // Migrate itself drives, not a new trust relationship) for its own
  // default anvil guest-access public key — the one that host's own
  // `anvil launch` already bakes into every VM it creates (see
  // internal/cli/commands's resolveSSHKeys/ensureDefaultAnvilKey). The
  // CLI's own `anvil migrate` calls this *before* migrating a VM and
  // injects the returned key into that VM's guest directly over SSH
  // (while it's still running, using whatever key already got it in
  // there) — a migrated disk skips cloud-init entirely on relaunch (see
  // the plan's Migration section), so without this, nothing the target
  // host's own anvil shell/exec/transfer could use would ever be
  // authorized in a VM migrated from elsewhere.
  rpc GuestKey(MigrateGuestKeyRequest) returns (MigrateGuestKeyReply);
}

message MigrateKeyRequest {}

message MigrateKeyReply {
  string public_key = 1;
}

message MigrateGuestKeyRequest {
  string to = 1; // same resolution as MigrateRequest.to
}

message MigrateGuestKeyReply {
  string public_key = 1;
}

message MigrateRequest {
  // name is looked up as a single instance first, a whole intent second
  // (the two are separate namespaces, nothing stops both existing under
  // the same name — a plain instance is just the more common, more
  // specific case, so it wins the lookup).
  string name = 1;
  string to = 2; // a known host's alias (HostService), or a literal "user@host[:port]"

  // Default mode is destructive: copy, verify the target actually has
  // it, then delete the source — never delete-first. copy skips that
  // last step and leaves the source instance running/stopped as-is.
  bool copy = 3;

  string dest_name = 4; // single-instance migration only; rejected if name resolves to an intent
  bool dry_run = 5;     // validate connectivity/preconditions and report the plan, transfer nothing

  // best_effort only applies when name resolves to an intent (rejected
  // for a single instance): migrate every member independently instead
  // of aborting the whole group and rolling back the target on the
  // first member that fails. Whatever succeeds gets deleted from the
  // source same as always; whatever fails is left alone, reported in
  // IntentDone.members either way.
  bool best_effort = 6;
}

message MigrateProgress {
  oneof event {
    string status = 1;
    string error = 2;
    string done = 3; // single-instance migration: the new instance's ID on the target, final event on success

    // member_done reports one intent member's own result, only ever
    // sent during an intent migration — one per member, all sent
    // together right after the whole group has been attempted (plain
    // status events already cover progress along the way), immediately
    // followed by the terminal intent_done summary below.
    MigrateMemberResult member_done = 4;

    // intent_done is an intent migration's final event, on success or
    // on a handled rollback alike (a genuine RPC error — can't resolve
    // the target, can't stop the members — still ends the stream with
    // MigrateProgress_Error instead, same as a single instance).
    IntentMigrateDone intent_done = 5;
  }
}

// MigrateMemberResult is one intent member's own migration outcome.
message MigrateMemberResult {
  string role = 1;
  string new_id = 2; // set when this member migrated successfully
  string error = 3;  // set when it didn't
}

// IntentMigrateDone is a whole-intent migration's final summary.
message IntentMigrateDone {
  string intent_name = 1;
  repeated MigrateMemberResult members = 2;

  // rolled_back is true if this was an all-or-nothing migration
  // (best_effort false) that hit a member failure: whatever had already
  // landed on the target was deleted there, and every source member was
  // left untouched, exactly as if the migration had never started.
  bool rolled_back = 3;
}
