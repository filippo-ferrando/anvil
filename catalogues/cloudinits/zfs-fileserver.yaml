#cloud-config
# ZFS-backed NFS + Samba file server.
#
# ZFS is a kernel module (or, on Linux, an out-of-tree one built against
# the running kernel via DKMS) that wants to own a whole block device
# directly — pool creation, snapshots, and scrubbing all assume real disks,
# not a container's layered/overlay filesystem. This template assumes the
# VM has a second virtio disk attached beyond its boot disk (`anvil launch
# --disk` sizes the boot disk only; attaching an extra data disk isn't yet
# exposed by anvil's own launch flags, so add one to the VM spec manually
# if you're adapting this) and creates the pool on it — check the actual
# device name (`lsblk`) before relying on /dev/vdb blindly on a real boot.

package_update: true

packages:
  - zfsutils-linux
  - nfs-kernel-server
  - samba

write_files:
  - path: /etc/zfs-fileserver-setup.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      set -e
      DEV=/dev/vdb
      if [ ! -b "$DEV" ]; then
        echo "no extra disk at $DEV, skipping pool creation — attach one and rerun this script"
        exit 0
      fi
      zpool list tank >/dev/null 2>&1 || zpool create -f tank "$DEV"
      zfs list tank/shared >/dev/null 2>&1 || zfs create tank/shared
      zfs set mountpoint=/srv/shared tank/shared

runcmd:
  - /etc/zfs-fileserver-setup.sh
  - echo "/srv/shared *(rw,sync,no_subtree_check,no_root_squash)" >> /etc/exports
  - exportfs -ra
  - systemctl enable --now nfs-kernel-server
  - |
    cat >> /etc/samba/smb.conf <<'EOF'
    [shared]
      path = /srv/shared
      browseable = yes
      writable = yes
      guest ok = no
    EOF
  - systemctl enable --now smbd
