#cloud-config
# MinIO, single-node/single-drive S3-compatible object storage.
#
# MinIO's real deployment target is a set of directly-attached disks it
# erasure-codes across itself (its own docs actively discourage running
# it over another storage layer, RAID, or a network filesystem) — the
# opposite of a container's usual "bind-mount a volume and don't think
# about the disk underneath" model. A VM gives it a real block device to
# own outright. This template runs single-drive for simplicity; for real
# multi-drive erasure coding, attach additional disks to the VM and list
# their mountpoints instead of the single /data path below.

package_update: true

packages:
  - wget

write_files:
  - path: /etc/default/minio
    permissions: "0644"
    content: |
      MINIO_VOLUMES="/data"
      MINIO_OPTS="--console-address :9001"
      MINIO_ROOT_USER=minioadmin
      MINIO_ROOT_PASSWORD=CHANGE-ME-before-exposing-this-anywhere
  - path: /etc/systemd/system/minio.service
    permissions: "0644"
    content: |
      [Unit]
      Description=MinIO
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=minio-user
      Group=minio-user
      EnvironmentFile=/etc/default/minio
      ExecStart=/usr/local/bin/minio server $MINIO_VOLUMES $MINIO_OPTS
      Restart=always
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target

runcmd:
  - useradd -r -s /sbin/nologin minio-user || true
  - mkdir -p /data
  - chown minio-user:minio-user /data
  - wget -q https://dl.min.io/server/minio/release/linux-amd64/minio -O /usr/local/bin/minio
  - chmod +x /usr/local/bin/minio
  - systemctl daemon-reload
  - systemctl enable --now minio
