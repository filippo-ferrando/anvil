#cloud-config
# Postfix (SMTP) + Dovecot (IMAP), a real mail stack.
#
# A mail server is several cooperating long-running daemons (an MTA, an
# IMAP server, usually a milter or two) that all expect a stable hostname/
# rDNS, bind low privileged ports (25, 143, 993), and keep mail queues and
# mailboxes as real on-disk state across restarts — the multi-process,
# init-system-managed shape containers are specifically not designed for
# (one container is meant to run one process). A VM's normal systemd and
# normal filesystem handle this the way mail server software actually
# expects to be run.
#
# Before exposing this to the real internet: set a real FQDN (`hostname`
# below and this VM's own rDNS), add TLS certs, and configure SPF/DKIM/
# DMARC — none of which a generic template can do for you.

package_update: true

packages:
  - postfix
  - dovecot-imapd
  - dovecot-lmtpd

write_files:
  - path: /etc/postfix/main.cf.d-append.cf
    permissions: "0644"
    content: |
      myhostname = mail.example.com
      mydestination = $myhostname, localhost.$mydomain, localhost
      home_mailbox = Maildir/
      inet_interfaces = all

runcmd:
  - echo "postfix postfix/mailname string mail.example.com" | debconf-set-selections
  - echo "postfix postfix/main_mailer_type string 'Internet Site'" | debconf-set-selections
  - cat /etc/postfix/main.cf.d-append.cf >> /etc/postfix/main.cf
  - postconf -e "home_mailbox = Maildir/"
  - sed -i "s/^mail_location = .*/mail_location = maildir:~\/Maildir/" /etc/dovecot/conf.d/10-mail.conf
  - systemctl restart postfix
  - systemctl enable --now dovecot
